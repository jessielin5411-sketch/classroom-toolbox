<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教學互動白板｜教學微光站</title>
  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#24324a",
            candy: "#4f8cff",
            mint: "#25c19a",
            sunshine: "#ffd24a",
            peach: "#ffad7a",
            berry: "#ff78b7"
          },
          boxShadow: {
            soft: "0 18px 44px rgba(36, 50, 74, 0.16)"
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body, #root { min-height: 100%; }
    body {
      margin: 0;
      overflow-x: hidden;
      color: #24324a;
      background:
        radial-gradient(circle at 8% 10%, rgba(255, 210, 74, 0.36), transparent 26%),
        radial-gradient(circle at 92% 12%, rgba(79, 140, 255, 0.22), transparent 28%),
        radial-gradient(circle at 85% 84%, rgba(255, 120, 183, 0.22), transparent 30%),
        linear-gradient(135deg, #fffaf1 0%, #eef9ff 46%, #f8f1ff 100%);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    .board-paper {
      background:
        linear-gradient(90deg, rgba(79, 140, 255, 0.08) 1px, transparent 1px),
        linear-gradient(rgba(79, 140, 255, 0.08) 1px, transparent 1px),
        #fffef8;
      background-size: 34px 34px;
      touch-action: none;
    }
    .whiteboard-grid {
      display: grid;
      gap: 12px;
      width: min(100%, 1600px);
      margin: 0 auto;
      padding: 12px;
      grid-template-columns: minmax(0, 1fr);
      align-items: start;
    }
    .control-rail,
    .tool-rail {
      display: grid;
      gap: 12px;
      min-width: 0;
    }
    .compact-button {
      min-height: 38px;
      padding: 7px 10px;
      font-size: 0.9rem;
      line-height: 1.15;
      white-space: normal;
      word-break: keep-all;
    }
    .compact-input {
      min-width: 0;
      height: 42px;
      border-radius: 14px;
      padding: 0 10px;
      font-size: 1rem;
    }
    .compact-grid {
      gap: 6px;
    }
    .control-rail .rounded-3xl,
    .tool-rail .rounded-3xl {
      border-radius: 20px;
    }
    .control-rail > section,
    .tool-rail > section {
      padding: 12px;
    }
    .stage-shell {
      order: 1;
      min-width: 0;
    }
    .control-rail {
      order: 2;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .tool-rail {
      order: 3;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .tablet-board {
      width: 100%;
      height: clamp(420px, calc(100vh - 190px), 720px);
      min-height: 0;
    }
    @media (max-width: 820px) {
      .control-rail,
      .tool-rail {
        grid-template-columns: minmax(0, 1fr);
      }
      .tablet-board {
        height: min(72vh, 560px);
      }
    }
    @media (min-width: 1180px) {
      .whiteboard-grid {
        grid-template-columns: 230px minmax(0, 1fr);
      }
      .control-rail {
        order: 1;
        grid-template-columns: minmax(0, 1fr);
      }
      .stage-shell {
        order: 2;
      }
      .tool-rail {
        grid-column: 1 / -1;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    @media (min-width: 1440px) {
      .whiteboard-grid {
        grid-template-columns: 240px minmax(0, 1fr) 255px;
      }
      .tool-rail {
        grid-column: auto;
        grid-template-columns: minmax(0, 1fr);
      }
      .tablet-board {
        height: clamp(520px, calc(100vh - 180px), 760px);
      }
    }
    canvas { touch-action: none; }
    .hide-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
    .hide-scrollbar::-webkit-scrollbar-thumb { background: rgba(79, 140, 255, 0.32); border-radius: 999px; }
    .safe-text { word-break: break-word; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyCWd6ouQ9MkPZgoTvOAC7h3JW02e4NONy8",
      authDomain: "fir-bac91.firebaseapp.com",
      projectId: "fir-bac91",
      storageBucket: "fir-bac91.firebasestorage.app",
      messagingSenderId: "835752740864",
      appId: "1:835752740864:web:770e85e39018e3a1ba70e5",
      measurementId: "G-B84M7QF72D"
    };

    const storeKey = "jessie-react-whiteboard-v2";
    const palette = ["#24324a", "#ef4444", "#f97316", "#eab308", "#22c55e", "#06b6d4", "#4f8cff", "#8b5cf6", "#ec4899"];
    const noteColors = ["#fff0a8", "#d9f7c8", "#cce9ff", "#ffd9e6", "#eadcff", "#ffe1b5"];
    const stamps = ["⭐", "💡", "✅", "❓", "👏", "❤️", "🌱", "🎯"];
    const seatColors = ["#4f8cff", "#25c19a", "#ffad4d", "#ff78b7", "#8b5cf6", "#06b6d4", "#ef4444", "#84cc16", "#f59e0b", "#14b8a6"];

    function cx(...parts) {
      return parts.filter(Boolean).join(" ");
    }

    function makeRoomCode() {
      return `BOARD-${Math.random().toString(36).slice(2, 6).toUpperCase()}`;
    }

    function normalizeRoomCode(value) {
      return String(value || "").trim().toUpperCase().replace(/[^A-Z0-9-]/g, "").slice(0, 18);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function boardName(boardId) {
      if (boardId.startsWith("group-")) return `第 ${boardId.split("-")[1]} 組白板`;
      return `${boardId.split("-")[1]} 號個人白板`;
    }

    function colorForSeat(seat) {
      const index = Math.max(0, Number(seat || 1) - 1);
      return seatColors[index % seatColors.length];
    }

    function getFirebaseErrorHint(error) {
      const code = error?.code || "";
      if (code.includes("admin-restricted") || code.includes("operation-not-allowed")) {
        return "匿名登入尚未開啟，請確認 Firebase 專案 fir-bac91 的 Authentication 已啟用 Anonymous。";
      }
      if (code.includes("permission-denied") || error?.message?.includes("permission")) {
        return "Firestore 規則尚未允許 whiteboardRooms 讀寫，請確認 Rules 已發布。";
      }
      return error?.message || "連線失敗，請確認網路與 Firebase 設定。";
    }

    function initFirebase() {
      if (!window.firebase) throw new Error("Firebase 載入失敗，請確認網路。");
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      return { auth: firebase.auth(), db: firebase.firestore() };
    }

    function visibleActionsFrom(actions) {
      const sorted = [...actions].sort((a, b) => (a.t || 0) - (b.t || 0));
      let clearAllAt = 0;
      const clearOwnerAt = new Map();
      sorted.forEach((action) => {
        if (action.type === "clear-all") clearAllAt = Math.max(clearAllAt, action.t || 0);
        if (action.type === "clear-owner" && action.targetAuthor) {
          clearOwnerAt.set(action.targetAuthor, Math.max(clearOwnerAt.get(action.targetAuthor) || 0, action.t || 0));
        }
      });
      return sorted.filter((action) => {
        if (action.type === "clear-all" || action.type === "clear-owner") return false;
        const authorClear = clearOwnerAt.get(action.authorId) || 0;
        return (action.t || 0) > clearAllAt && (action.t || 0) > authorClear;
      });
    }

    function notesFromActions(actions) {
      const notes = new Map();
      actions.forEach((action) => {
        if (action.type === "note-add") notes.set(action.note.id, action.note);
        if (action.type === "note-update" && notes.has(action.note.id)) notes.set(action.note.id, { ...notes.get(action.note.id), ...action.note });
        if (action.type === "note-delete") notes.delete(action.noteId);
      });
      return [...notes.values()];
    }

    function participantsFromActions(actions) {
      const participants = new Map();
      actions.forEach((action) => {
        if (!action.authorId) return;
        participants.set(action.authorId, {
          id: action.authorId,
          name: action.authorName || "未命名",
          color: action.authorColor || "#4f8cff",
          lastAt: action.t || 0
        });
      });
      return [...participants.values()].sort((a, b) => b.lastAt - a.lastAt).slice(0, 20);
    }

    function drawStroke(ctx, action) {
      const points = action.points || [];
      if (points.length < 2) return;
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.globalAlpha = action.tool === "marker" ? 0.46 : 1;
      ctx.strokeStyle = action.color || "#24324a";
      ctx.lineWidth = action.size || 8;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i += 1) {
        const midX = (points[i - 1].x + points[i].x) / 2;
        const midY = (points[i - 1].y + points[i].y) / 2;
        ctx.quadraticCurveTo(points[i - 1].x, points[i - 1].y, midX, midY);
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawStamp(ctx, action) {
      ctx.save();
      ctx.font = `${action.size || 42}px "Noto Sans TC", "Microsoft JhengHei", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(action.stamp || "⭐", action.x, action.y);
      ctx.restore();
    }

    function Button({ active, className = "", children, ...props }) {
      return (
        <button
          className={cx(
            "min-h-11 rounded-2xl px-4 py-2 text-base font-black shadow-sm transition active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-45",
            active ? "bg-gradient-to-r from-candy to-violet-500 text-white" : "bg-white text-ink hover:bg-blue-50",
            className
          )}
          {...props}
        >
          {children}
        </button>
      );
    }

    function Panel({ title, children, className = "" }) {
      return (
        <section className={cx("rounded-3xl border border-white/80 bg-white/90 p-4 shadow-soft backdrop-blur", className)}>
          {title && <h2 className="mb-3 text-xl font-black text-ink">{title}</h2>}
          {children}
        </section>
      );
    }

    function TopBar({ exportImage, requestFullscreen }) {
      return (
        <header className="sticky top-0 z-30 flex flex-wrap items-center justify-between gap-3 border-b border-white/80 bg-white/85 px-4 py-3 shadow-sm backdrop-blur">
          <a href="../index.html" className="flex items-center gap-3 text-ink no-underline">
            <span className="grid h-12 w-12 place-items-center rounded-2xl bg-gradient-to-br from-candy to-violet-500 text-2xl text-white shadow-lg">✎</span>
            <span className="grid leading-tight">
              <strong className="text-2xl font-black">教學互動白板</strong>
              <span className="text-sm font-bold text-slate-500">老師開教室，學生選號碼一起共作</span>
            </span>
          </a>
          <div className="flex flex-wrap gap-2">
            <Button className="bg-mint text-white hover:bg-mint" onClick={exportImage}>匯出圖片</Button>
            <Button onClick={requestFullscreen}>大螢幕</Button>
          </div>
        </header>
      );
    }

    function ConnectionPanel(props) {
      const {
        role, setRole, roomCode, setRoomCode, seat, setSeat, studentCount, setStudentCount,
        groupCount, setGroupCount, status, statusType, createRoom, joinRoom, leaveRoom,
        copyLink, isConnected
      } = props;
      const seats = Array.from({ length: Number(studentCount) || 1 }, (_, i) => i + 1);
      return (
        <Panel title="共用教室">
          <div className="grid gap-3">
            <div className="compact-grid grid grid-cols-2 rounded-2xl bg-blue-50 p-1">
              <Button className="compact-button" active={role === "teacher"} onClick={() => setRole("teacher")}>老師端</Button>
              <Button className="compact-button" active={role === "student"} onClick={() => setRole("student")}>學生端</Button>
            </div>

            {role === "teacher" && (
              <div className="compact-grid grid grid-cols-2">
                <label className="grid gap-1 text-sm font-black text-slate-600">
                  班級人數
                  <input className="compact-input border-2 border-blue-100 font-black outline-none focus:border-candy" type="number" min="1" max="60" value={studentCount} onChange={(e) => setStudentCount(clamp(Number(e.target.value) || 1, 1, 60))} />
                </label>
                <label className="grid gap-1 text-sm font-black text-slate-600">
                  小組數量
                  <input className="compact-input border-2 border-blue-100 font-black outline-none focus:border-candy" type="number" min="1" max="12" value={groupCount} onChange={(e) => setGroupCount(clamp(Number(e.target.value) || 1, 1, 12))} />
                </label>
              </div>
            )}

            <label className="grid gap-1 text-sm font-black text-slate-600">
              房間碼
              <input className="compact-input border-2 border-blue-100 text-lg font-black outline-none focus:border-candy" value={roomCode} onChange={(e) => setRoomCode(normalizeRoomCode(e.target.value))} placeholder="BOARD-ABCD" />
            </label>

            {role === "student" && (
              <div className="grid gap-2">
                <div className="text-sm font-black text-slate-600">選擇你的座號</div>
                <div className="compact-grid grid max-h-40 grid-cols-5 overflow-auto rounded-2xl bg-white/80 p-2 hide-scrollbar">
                  {seats.map((n) => (
                    <button
                      key={n}
                      className={cx("h-9 rounded-xl text-sm font-black shadow-sm", seat === n ? "bg-candy text-white" : "bg-blue-50 text-ink")}
                      onClick={() => setSeat(n)}
                    >
                      {n}
                    </button>
                  ))}
                </div>
              </div>
            )}

            <div className="compact-grid grid grid-cols-2">
              {role === "teacher" ? (
                <Button className="compact-button bg-mint text-white hover:bg-mint" onClick={createRoom}>開教室</Button>
              ) : (
                <Button className="compact-button bg-mint text-white hover:bg-mint" onClick={joinRoom}>加入教室</Button>
              )}
              <Button className="compact-button" onClick={copyLink}>複製連結</Button>
              <Button className="compact-button" onClick={leaveRoom}>離開</Button>
              {role === "teacher" && <Button className="compact-button" onClick={() => setRoomCode(makeRoomCode())}>產生房號</Button>}
            </div>

            <div className={cx(
              "rounded-2xl px-3 py-2 text-sm font-black leading-relaxed",
              statusType === "online" ? "bg-emerald-50 text-emerald-700" : statusType === "error" ? "bg-orange-100 text-orange-800" : "bg-blue-50 text-blue-700"
            )}>
              {status || (isConnected ? "已連線" : "尚未連線")}
            </div>

            <p className="rounded-2xl bg-amber-50 px-3 py-2 text-sm font-bold leading-relaxed text-amber-800">
              學生會以座號作答。學生只能清除自己送出的筆跡、便條與印章；老師端可清空目前白板。
            </p>
          </div>
        </Panel>
      );
    }

    function BoardSwitcher({ role, seat, mode, setMode, activeBoard, setActiveBoard, studentCount, groupCount }) {
      const personalBoards = Array.from({ length: Number(studentCount) || 1 }, (_, i) => `personal-${i + 1}`);
      const groupBoards = Array.from({ length: Number(groupCount) || 1 }, (_, i) => `group-${i + 1}`);
      const boards = mode === "group" ? groupBoards : personalBoards;
      const availableBoards = role === "student" && mode === "personal" ? [`personal-${seat || 1}`] : boards;

      useEffect(() => {
        if (role === "student" && mode === "personal" && seat) setActiveBoard(`personal-${seat}`);
      }, [role, mode, seat]);

      return (
        <Panel title="白板範圍">
          <div className="compact-grid mb-3 grid grid-cols-2 rounded-2xl bg-blue-50 p-1">
            <Button className="compact-button" active={mode === "personal"} onClick={() => setMode("personal")}>個人</Button>
            <Button className="compact-button" active={mode === "group"} onClick={() => setMode("group")}>分組</Button>
          </div>
          <div className="compact-grid grid max-h-52 grid-cols-2 overflow-auto hide-scrollbar">
            {availableBoards.map((id) => (
              <button
                key={id}
                className={cx("min-h-10 rounded-xl px-2 py-1 text-left text-xs font-black leading-snug shadow-sm", activeBoard === id ? "bg-gradient-to-r from-candy to-violet-500 text-white" : "bg-white text-ink")}
                onClick={() => setActiveBoard(id)}
              >
                {boardName(id)}
              </button>
            ))}
          </div>
        </Panel>
      );
    }

    function ToolPanel(props) {
      const {
        role, tool, setTool, color, setColor, noteColor, setNoteColor, size, setSize,
        stamp, setStamp, addNote, noteText, setNoteText, clearMine, clearAll, canWrite
      } = props;
      const tools = [{ id: "pen", label: "畫筆" }, { id: "marker", label: "螢光筆" }, { id: "note", label: "便條" }, { id: "stamp", label: "印章" }];

      return (
        <div className="grid gap-4">
          <Panel title="書寫工具">
            <div className="mb-3 flex flex-wrap gap-2">
              {tools.map((item) => <Button key={item.id} active={tool === item.id} onClick={() => setTool(item.id)}>{item.label}</Button>)}
            </div>
            <label className="grid gap-2 text-sm font-black text-slate-600">
              筆跡粗細 <span className="text-lg text-ink">{size}</span>
              <input type="range" min="2" max="34" value={size} onChange={(e) => setSize(Number(e.target.value))} className="accent-candy" />
            </label>
          </Panel>

          <Panel title="顏色">
            <div className="flex flex-wrap gap-2">
              {palette.map((item) => (
                <button key={item} aria-label={item} className={cx("h-11 w-11 rounded-full border-4 border-white shadow", color === item && "ring-4 ring-candy/35")} style={{ background: item }} onClick={() => setColor(item)} />
              ))}
            </div>
          </Panel>

          <Panel title="快速便條">
            <textarea className="mb-3 min-h-24 w-full resize-y rounded-2xl border-2 border-blue-100 p-3 text-lg font-bold outline-none focus:border-candy" value={noteText} onChange={(e) => setNoteText(e.target.value)} placeholder="寫下想法、答案或小組討論..." />
            <div className="mb-3 flex flex-wrap gap-2">
              {noteColors.map((item) => (
                <button key={item} className={cx("h-10 w-10 rounded-full border-4 border-white shadow", noteColor === item && "ring-4 ring-candy/35")} style={{ background: item }} onClick={() => setNoteColor(item)} />
              ))}
            </div>
            <Button className="w-full bg-mint text-white hover:bg-mint" disabled={!canWrite} onClick={addNote}>張貼便條</Button>
          </Panel>

          <Panel title="印章">
            <div className="grid grid-cols-4 gap-2">
              {stamps.map((item) => (
                <button key={item} className={cx("h-12 rounded-2xl bg-white text-2xl shadow-sm", stamp === item && "ring-4 ring-candy/35")} onClick={() => setStamp(item)}>{item}</button>
              ))}
            </div>
          </Panel>

          <Panel title="清除">
            <div className="grid gap-2">
              <Button className="bg-amber-400 text-ink hover:bg-amber-400" disabled={!canWrite} onClick={clearMine}>清除我的內容</Button>
              {role === "teacher" && <Button className="bg-red-500 text-white hover:bg-red-500" disabled={!canWrite} onClick={clearAll}>老師清空目前白板</Button>}
            </div>
          </Panel>
        </div>
      );
    }

    function SessionTimer() {
      const [seconds, setSeconds] = useState(300);
      const [customMinutes, setCustomMinutes] = useState(5);
      const [customSeconds, setCustomSeconds] = useState(0);
      const [running, setRunning] = useState(false);
      useEffect(() => {
        if (!running) return undefined;
        const id = window.setInterval(() => {
          setSeconds((value) => {
            const next = Math.max(0, value - 1);
            if (next === 0) setRunning(false);
            return next;
          });
        }, 1000);
        return () => window.clearInterval(id);
      }, [running]);
      const setPreset = (value) => {
        setRunning(false);
        setSeconds(value);
        setCustomMinutes(Math.floor(value / 60));
        setCustomSeconds(value % 60);
      };
      const applyCustomTime = () => {
        const next = clamp((Number(customMinutes) || 0) * 60 + (Number(customSeconds) || 0), 1, 5999);
        setRunning(false);
        setSeconds(next);
      };
      const mm = String(Math.floor(seconds / 60)).padStart(2, "0");
      const ss = String(seconds % 60).padStart(2, "0");
      return (
        <Panel title="活動計時器">
          <div className="mb-3 rounded-3xl bg-ink px-4 py-3 text-center text-4xl font-black text-sunshine">{mm}:{ss}</div>
          <div className="mb-3 grid grid-cols-3 gap-2">
            <Button onClick={() => setPreset(180)}>3分</Button>
            <Button onClick={() => setPreset(300)}>5分</Button>
            <Button active={running} onClick={() => setRunning(!running)}>{running ? "暫停" : "開始"}</Button>
          </div>
          <div className="grid grid-cols-[1fr_1fr_auto] gap-2">
            <label className="grid gap-1 text-xs font-black text-slate-500">
              分
              <input
                className="h-11 rounded-2xl border-2 border-blue-100 px-3 text-center text-lg font-black outline-none focus:border-candy"
                type="number"
                min="0"
                max="99"
                value={customMinutes}
                onChange={(e) => setCustomMinutes(clamp(Number(e.target.value) || 0, 0, 99))}
              />
            </label>
            <label className="grid gap-1 text-xs font-black text-slate-500">
              秒
              <input
                className="h-11 rounded-2xl border-2 border-blue-100 px-3 text-center text-lg font-black outline-none focus:border-candy"
                type="number"
                min="0"
                max="59"
                value={customSeconds}
                onChange={(e) => setCustomSeconds(clamp(Number(e.target.value) || 0, 0, 59))}
              />
            </label>
            <Button className="self-end bg-candy text-white hover:bg-candy" onClick={applyCustomTime}>套用</Button>
          </div>
        </Panel>
      );
    }

    function QuickScoreboard() {
      const [scores, setScores] = useState({ A: 0, B: 0, C: 0, D: 0 });
      const adjustScore = (team, delta) => {
        setScores((prev) => ({ ...prev, [team]: (Number(prev[team]) || 0) + delta }));
      };
      const setTeamScore = (team, value) => {
        setScores((prev) => ({ ...prev, [team]: Number(value) || 0 }));
      };
      const resetScores = () => {
        setScores(Object.fromEntries(Object.keys(scores).map((team) => [team, 0])));
      };
      return (
        <Panel title="小組加分">
          <div className="mb-3 grid gap-2">
            {Object.entries(scores).map(([team, score]) => (
              <div key={team} className="grid grid-cols-[1fr_auto_auto] items-center gap-2 rounded-2xl bg-white p-2 shadow-sm">
                <label className="grid gap-1 text-sm font-black text-slate-500">
                  第 {team} 組
                  <input
                    className="h-11 w-full rounded-2xl border-2 border-blue-100 px-3 text-center text-2xl font-black text-candy outline-none focus:border-candy"
                    type="number"
                    value={score}
                    onChange={(e) => setTeamScore(team, e.target.value)}
                  />
                </label>
                <button className="h-11 w-11 rounded-2xl bg-blue-50 text-2xl font-black text-candy shadow-sm" onClick={() => adjustScore(team, 1)}>+</button>
                <button className="h-11 w-11 rounded-2xl bg-rose-50 text-2xl font-black text-rose-500 shadow-sm" onClick={() => adjustScore(team, -1)}>-</button>
              </div>
            ))}
          </div>
          <Button className="w-full bg-slate-200 text-ink hover:bg-slate-200" onClick={resetScores}>全部歸零</Button>
        </Panel>
      );
    }

    function ParticipantPanel({ participants, currentAuthor }) {
      return (
        <Panel title="作答紀錄">
          <div className="grid gap-2">
            {currentAuthor && (
              <div className="rounded-2xl bg-blue-50 px-3 py-2 text-sm font-black text-blue-700">
                目前身分：{currentAuthor.name}
              </div>
            )}
            {participants.length === 0 ? (
              <div className="rounded-2xl bg-slate-50 px-3 py-3 text-sm font-bold text-slate-500">還沒有學生作答。</div>
            ) : participants.map((person) => (
              <div key={person.id} className="flex items-center gap-2 rounded-2xl bg-white px-3 py-2 shadow-sm">
                <span className="h-4 w-4 rounded-full" style={{ background: person.color }} />
                <strong className="safe-text text-sm">{person.name}</strong>
              </div>
            ))}
          </div>
        </Panel>
      );
    }

    function WhiteboardStage({ activeBoard, actions, notes, currentAuthor, canWrite, tool, color, size, stamp, onAction, onNoteUpdate, onNoteDelete }) {
      const canvasRef = useRef(null);
      const wrapRef = useRef(null);
      const drawingRef = useRef(null);

      const renderCanvas = () => {
        const canvas = canvasRef.current;
        const wrap = wrapRef.current;
        if (!canvas || !wrap) return;
        const rect = wrap.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(rect.width * dpr));
        canvas.height = Math.max(1, Math.round(rect.height * dpr));
        canvas.style.width = `${rect.width}px`;
        canvas.style.height = `${rect.height}px`;
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, rect.width, rect.height);
        actions.forEach((action) => {
          if (action.type === "stroke") drawStroke(ctx, action);
          if (action.type === "stamp") drawStamp(ctx, action);
        });
      };

      useEffect(() => {
        renderCanvas();
      }, [actions, activeBoard]);

      useEffect(() => {
        const onResize = () => renderCanvas();
        window.addEventListener("resize", onResize);
        return () => window.removeEventListener("resize", onResize);
      }, [actions]);

      const getPoint = (event) => {
        const rect = wrapRef.current.getBoundingClientRect();
        return { x: clamp(event.clientX - rect.left, 0, rect.width), y: clamp(event.clientY - rect.top, 0, rect.height) };
      };

      const pointerDown = (event) => {
        if (!canWrite || !currentAuthor) return;
        const point = getPoint(event);
        if (tool === "stamp") {
          onAction({ type: "stamp", x: point.x, y: point.y, stamp, size: Math.max(32, size * 2) });
          return;
        }
        if (tool === "note") return;
        event.currentTarget.setPointerCapture(event.pointerId);
        drawingRef.current = { points: [point], tool, color, size };
      };

      const pointerMove = (event) => {
        if (!drawingRef.current) return;
        const point = getPoint(event);
        const stroke = drawingRef.current;
        const previous = stroke.points[stroke.points.length - 1];
        stroke.points.push(point);
        const ctx = canvasRef.current.getContext("2d");
        drawStroke(ctx, { ...stroke, points: [previous, point] });
      };

      const pointerUp = () => {
        if (!drawingRef.current) return;
        const stroke = drawingRef.current;
        drawingRef.current = null;
        if (stroke.points.length > 1) onAction({ type: "stroke", ...stroke });
      };

      return (
        <main className="stage-shell grid min-w-0 grid-rows-[auto_minmax(0,1fr)] gap-3">
          <div className="flex flex-wrap items-end justify-between gap-3 px-1">
            <div>
              <h1 className="text-3xl font-black text-ink md:text-4xl">{boardName(activeBoard)}</h1>
              <p className="font-bold text-slate-500">可用滑鼠、觸控筆或手指書寫；學生作答會記錄座號。</p>
            </div>
            <div className="rounded-3xl bg-white/90 px-4 py-2 text-sm font-black text-slate-600 shadow-sm">
              {canWrite ? "可以作答" : "請先開教室或選座號加入"}
            </div>
          </div>

          <section ref={wrapRef} className="board-paper tablet-board relative overflow-hidden rounded-[2rem] border-[8px] border-amber-300 shadow-soft">
            <canvas
              ref={canvasRef}
              className="absolute inset-0 h-full w-full cursor-crosshair"
              onPointerDown={pointerDown}
              onPointerMove={pointerMove}
              onPointerUp={pointerUp}
              onPointerCancel={pointerUp}
            />
            <div className="pointer-events-none absolute inset-0">
              {notes.map((note) => {
                const mine = currentAuthor?.id === note.authorId;
                const canEdit = mine || currentAuthor?.role === "teacher";
                return <StickyNote key={note.id} note={note} canEdit={canEdit} onUpdate={onNoteUpdate} onDelete={onNoteDelete} />;
              })}
            </div>
          </section>
        </main>
      );
    }

    function StickyNote({ note, canEdit, onUpdate, onDelete }) {
      const [text, setText] = useState(note.text || "");
      useEffect(() => setText(note.text || ""), [note.text]);
      const commit = () => {
        if (canEdit && text !== note.text) onUpdate({ ...note, text });
      };
      return (
        <article
          className="pointer-events-auto absolute grid min-h-[128px] w-[210px] grid-rows-[auto_1fr] rounded-2xl border-2 border-white/80 shadow-lg"
          style={{ left: `${note.x}px`, top: `${note.y}px`, background: note.color || "#fff0a8", transform: `rotate(${note.tilt || -1}deg)` }}
        >
          <header className="flex items-center justify-between gap-2 px-3 pt-2 text-xs font-black text-slate-700">
            <span className="safe-text">#{note.seat || "師"} {note.authorName || ""}</span>
            {canEdit && <button className="grid h-7 w-7 place-items-center rounded-full bg-white/80 font-black" onClick={() => onDelete(note)}>×</button>}
          </header>
          <textarea
            className="min-h-[86px] resize-none rounded-b-2xl border-0 bg-transparent p-3 text-lg font-black text-ink outline-none"
            value={text}
            readOnly={!canEdit}
            onChange={(e) => setText(e.target.value)}
            onBlur={commit}
          />
        </article>
      );
    }

    function App() {
      const url = new URL(window.location.href);
      const initialRoom = normalizeRoomCode(url.searchParams.get("room") || localStorage.getItem(`${storeKey}-room`) || "");
      const savedRole = localStorage.getItem(`${storeKey}-role`) || (initialRoom ? "student" : "teacher");
      const savedSeat = Number(localStorage.getItem(`${storeKey}-seat`) || "0");

      const [role, setRole] = useState(savedRole);
      const [roomCode, setRoomCode] = useState(initialRoom || makeRoomCode());
      const [studentCount, setStudentCount] = useState(Number(localStorage.getItem(`${storeKey}-studentCount`) || 24));
      const [groupCount, setGroupCount] = useState(Number(localStorage.getItem(`${storeKey}-groupCount`) || 6));
      const [seat, setSeat] = useState(savedSeat || 1);
      const [mode, setMode] = useState("personal");
      const [activeBoard, setActiveBoard] = useState(`personal-${savedSeat || 1}`);
      const [tool, setTool] = useState("pen");
      const [color, setColor] = useState(palette[0]);
      const [noteColor, setNoteColor] = useState(noteColors[0]);
      const [size, setSize] = useState(8);
      const [stamp, setStamp] = useState(stamps[0]);
      const [noteText, setNoteText] = useState("");
      const [status, setStatus] = useState("尚未連線");
      const [statusType, setStatusType] = useState("");
      const [connected, setConnected] = useState(false);
      const [actions, setActions] = useState([]);

      const firebaseRef = useRef({ auth: null, db: null });
      const actionUnsubRef = useRef(null);
      const roomUnsubRef = useRef(null);

      const currentAuthor = useMemo(() => {
        if (role === "student" && !seat) return null;
        if (role === "student") {
          return { id: `student-${seat}`, role, seat, name: `${seat} 號`, color: colorForSeat(seat) };
        }
        return { id: "teacher", role, seat: "老師", name: "老師", color: "#8b5cf6" };
      }, [role, seat]);

      const visibleActions = useMemo(() => visibleActionsFrom(actions.filter((action) => action.boardId === activeBoard)), [actions, activeBoard]);
      const notes = useMemo(() => notesFromActions(visibleActions), [visibleActions]);
      const participants = useMemo(() => participantsFromActions(visibleActions), [visibleActions]);
      const canWrite = connected && Boolean(currentAuthor);

      useEffect(() => {
        localStorage.setItem(`${storeKey}-role`, role);
        localStorage.setItem(`${storeKey}-seat`, String(seat || ""));
        localStorage.setItem(`${storeKey}-studentCount`, String(studentCount));
        localStorage.setItem(`${storeKey}-groupCount`, String(groupCount));
      }, [role, seat, studentCount, groupCount]);

      useEffect(() => {
        if (mode === "personal" && role === "student") setActiveBoard(`personal-${seat || 1}`);
      }, [mode, role, seat]);

      useEffect(() => {
        if (connected) listenToBoard(activeBoard);
      }, [activeBoard]);

      async function signIn() {
        const firebaseTools = initFirebase();
        firebaseRef.current = firebaseTools;
        if (!firebaseTools.auth.currentUser) await firebaseTools.auth.signInAnonymously();
        return firebaseTools;
      }

      function setOnline(message) {
        setStatus(message);
        setStatusType("online");
      }

      function setError(error) {
        setStatus(getFirebaseErrorHint(error));
        setStatusType("error");
      }

      async function createRoom() {
        const code = normalizeRoomCode(roomCode || makeRoomCode());
        setRoomCode(code);
        setStatus("正在開教室...");
        setStatusType("");
        try {
          const { db, auth } = await signIn();
          await db.collection("whiteboardRooms").doc(code).set({
            roomCode: code,
            teacherUid: auth.currentUser.uid,
            studentCount: Number(studentCount) || 24,
            groupCount: Number(groupCount) || 6,
            updatedAt: Date.now()
          }, { merge: true });
          localStorage.setItem(`${storeKey}-room`, code);
          setConnected(true);
          listenToRoom(code);
          listenToBoard(activeBoard, code);
          setOnline(`教室已開啟：${code}`);
        } catch (error) {
          setError(error);
        }
      }

      async function joinRoom() {
        const code = normalizeRoomCode(roomCode);
        if (!code) {
          setStatus("請先輸入房間碼。");
          setStatusType("error");
          return;
        }
        if (role === "student" && !seat) {
          setStatus("學生加入前請先選擇座號。");
          setStatusType("error");
          return;
        }
        setStatus("正在加入教室...");
        setStatusType("");
        try {
          const { db } = await signIn();
          const doc = await db.collection("whiteboardRooms").doc(code).get();
          if (!doc.exists) throw new Error("找不到這個教室，請確認房間碼。");
          const data = doc.data() || {};
          setStudentCount(Number(data.studentCount) || studentCount);
          setGroupCount(Number(data.groupCount) || groupCount);
          localStorage.setItem(`${storeKey}-room`, code);
          setConnected(true);
          listenToRoom(code);
          listenToBoard(activeBoard, code);
          setOnline(`已加入教室：${code}`);
        } catch (error) {
          setError(error);
        }
      }

      function listenToRoom(code = roomCode) {
        if (roomUnsubRef.current) roomUnsubRef.current();
        const { db } = firebaseRef.current;
        if (!db) return;
        roomUnsubRef.current = db.collection("whiteboardRooms").doc(code).onSnapshot((doc) => {
          const data = doc.data() || {};
          if (data.studentCount) setStudentCount(Number(data.studentCount));
          if (data.groupCount) setGroupCount(Number(data.groupCount));
        }, setError);
      }

      function listenToBoard(boardId, code = roomCode) {
        if (actionUnsubRef.current) actionUnsubRef.current();
        const { db } = firebaseRef.current;
        if (!db || !code) return;
        actionUnsubRef.current = db
          .collection("whiteboardRooms")
          .doc(code)
          .collection("boards")
          .doc(boardId)
          .collection("actions")
          .orderBy("t")
          .limit(900)
          .onSnapshot((snapshot) => {
            const remote = [];
            snapshot.forEach((doc) => remote.push({ id: doc.id, ...doc.data() }));
            setActions((prev) => {
              const otherBoards = prev.filter((item) => item.boardId !== boardId);
              return [...otherBoards, ...remote];
            });
            setOnline(`已同步：${code}｜${boardName(boardId)}`);
          }, setError);
      }

      async function syncAction(action) {
        if (!canWrite || !firebaseRef.current.db) return;
        const actionId = `act-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const payload = {
          ...action,
          id: actionId,
          boardId: activeBoard,
          t: Date.now(),
          authorId: currentAuthor.id,
          authorName: currentAuthor.name,
          authorColor: currentAuthor.color,
          seat: currentAuthor.seat
        };
        setActions((prev) => [...prev.filter((item) => item.id !== actionId), payload]);
        try {
          await firebaseRef.current.db
            .collection("whiteboardRooms")
            .doc(normalizeRoomCode(roomCode))
            .collection("boards")
            .doc(activeBoard)
            .collection("actions")
            .doc(actionId)
            .set(payload);
        } catch (error) {
          setError(error);
        }
      }

      function addNote() {
        if (!currentAuthor) return;
        const text = noteText.trim() || "我的想法是...";
        const note = {
          id: `note-${Date.now()}-${Math.random().toString(16).slice(2)}`,
          x: 48 + Math.random() * 140,
          y: 52 + Math.random() * 120,
          text,
          color: noteColor,
          tilt: Math.round(Math.random() * 6 - 3),
          authorId: currentAuthor.id,
          authorName: currentAuthor.name,
          seat: currentAuthor.seat
        };
        setNoteText("");
        syncAction({ type: "note-add", note, authorId: currentAuthor.id });
      }

      function updateNote(note) {
        if (!currentAuthor) return;
        if (role !== "teacher" && note.authorId !== currentAuthor.id) return;
        syncAction({ type: "note-update", note, authorId: note.authorId });
      }

      function deleteNote(note) {
        if (!currentAuthor) return;
        if (role !== "teacher" && note.authorId !== currentAuthor.id) return;
        syncAction({ type: "note-delete", noteId: note.id, authorId: note.authorId });
      }

      function clearMine() {
        if (!currentAuthor) return;
        syncAction({ type: "clear-owner", targetAuthor: currentAuthor.id, authorId: currentAuthor.id });
      }

      function clearAll() {
        if (role !== "teacher") return;
        syncAction({ type: "clear-all" });
      }

      function leaveRoom() {
        if (actionUnsubRef.current) actionUnsubRef.current();
        if (roomUnsubRef.current) roomUnsubRef.current();
        actionUnsubRef.current = null;
        roomUnsubRef.current = null;
        setConnected(false);
        setActions([]);
        localStorage.removeItem(`${storeKey}-room`);
        setStatus("已離開教室");
        setStatusType("");
      }

      async function copyLink() {
        const code = normalizeRoomCode(roomCode);
        if (!code) return;
        const link = new URL(window.location.href);
        link.searchParams.set("room", code);
        try {
          await navigator.clipboard.writeText(link.toString());
          setStatus("已複製學生連結。");
          setStatusType(connected ? "online" : "");
        } catch {
          setStatus("無法自動複製，請手動複製網址。");
          setStatusType("error");
        }
      }

      function exportImage() {
        const canvas = document.querySelector("canvas");
        if (!canvas) return;
        const exportCanvas = document.createElement("canvas");
        exportCanvas.width = canvas.width;
        exportCanvas.height = canvas.height;
        const ctx = exportCanvas.getContext("2d");
        const scale = canvas.width / Math.max(1, canvas.getBoundingClientRect().width);
        ctx.fillStyle = "#fffef8";
        ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
        ctx.drawImage(canvas, 0, 0);
        notes.forEach((note) => {
          const x = note.x * scale;
          const y = note.y * scale;
          const width = 210 * scale;
          const height = 128 * scale;
          ctx.save();
          ctx.fillStyle = note.color || "#fff0a8";
          ctx.strokeStyle = "rgba(36, 50, 74, 0.2)";
          ctx.lineWidth = 2 * scale;
          ctx.beginPath();
          ctx.roundRect(x, y, width, height, 16 * scale);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#24324a";
          ctx.font = `${14 * scale}px Microsoft JhengHei, sans-serif`;
          ctx.fillText(`#${note.seat || "師"} ${note.authorName || ""}`, x + 12 * scale, y + 24 * scale);
          ctx.font = `bold ${18 * scale}px Microsoft JhengHei, sans-serif`;
          String(note.text || "").split(/\n/).slice(0, 4).forEach((line, index) => {
            ctx.fillText(line.slice(0, 13), x + 12 * scale, y + (54 + index * 24) * scale);
          });
          ctx.restore();
        });
        const link = document.createElement("a");
        link.download = `${boardName(activeBoard)}.png`;
        link.href = exportCanvas.toDataURL("image/png");
        link.click();
      }

      function requestFullscreen() {
        document.documentElement.requestFullscreen?.();
      }

      return (
        <div className="min-h-screen">
          <TopBar exportImage={exportImage} requestFullscreen={requestFullscreen} />
          <div className="whiteboard-grid">
            <aside className="control-rail">
              <ConnectionPanel
                role={role}
                setRole={setRole}
                roomCode={roomCode}
                setRoomCode={setRoomCode}
                seat={seat}
                setSeat={setSeat}
                studentCount={studentCount}
                setStudentCount={setStudentCount}
                groupCount={groupCount}
                setGroupCount={setGroupCount}
                status={status}
                statusType={statusType}
                createRoom={createRoom}
                joinRoom={joinRoom}
                leaveRoom={leaveRoom}
                copyLink={copyLink}
                isConnected={connected}
              />
              <BoardSwitcher
                role={role}
                seat={seat}
                mode={mode}
                setMode={setMode}
                activeBoard={activeBoard}
                setActiveBoard={setActiveBoard}
                studentCount={studentCount}
                groupCount={groupCount}
              />
            </aside>

            <WhiteboardStage
              activeBoard={activeBoard}
              actions={visibleActions}
              notes={notes}
              currentAuthor={currentAuthor}
              canWrite={canWrite}
              tool={tool}
              color={color}
              size={size}
              stamp={stamp}
              onAction={syncAction}
              onNoteUpdate={updateNote}
              onNoteDelete={deleteNote}
            />

            <aside className="tool-rail">
              <ToolPanel
                role={role}
                tool={tool}
                setTool={setTool}
                color={color}
                setColor={setColor}
                noteColor={noteColor}
                setNoteColor={setNoteColor}
                size={size}
                setSize={setSize}
                stamp={stamp}
                setStamp={setStamp}
                addNote={addNote}
                noteText={noteText}
                setNoteText={setNoteText}
                clearMine={clearMine}
                clearAll={clearAll}
                canWrite={canWrite}
              />
              <ParticipantPanel participants={participants} currentAuthor={currentAuthor} />
              <SessionTimer />
              <QuickScoreboard />
            </aside>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
