<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>班級幹部職缺表｜教學微光站</title>
  <style>
    :root{--ink:#28445d;--orange:#ff7625;--blue:#326df4;--yellow:#fff3b1;--pink:#fff1f4;--line:#d8e3ef;--paper:#fffdfa;--shadow:0 14px 30px rgba(76,75,91,.14)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:linear-gradient(rgba(255,250,239,.76),rgba(255,250,239,.84)),url('./assets-3d-classroom.png') center top/cover fixed,#fff9ee}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1260px;margin:auto;padding:20px 18px 58px}.hero{text-align:center;margin:2px 0 22px}.hero h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1;margin:0;color:var(--orange);text-shadow:3px 3px 0 #ffd9bd}.hero h1 span{color:var(--blue)}.hero p{margin:12px 0 0;font-size:1.05rem;color:#56708a}.back{display:inline-block;margin:0 0 9px;color:#4082c8;text-decoration:none;font-size:.9rem}.panel{background:rgba(255,255,255,.9);border:3px solid #fff;border-radius:25px;padding:21px;box-shadow:var(--shadow);margin-bottom:20px}.panel h2{font-size:1.15rem;margin:0 0 15px}.steps{display:grid;grid-template-columns:.7fr 1fr auto;align-items:end;gap:11px}.field{min-width:0}.field label{display:block;margin:0 0 6px;font-size:.86rem;font-weight:800;color:#3f6b90}.control{width:100%;height:44px;border:2px solid #d7e4f0;border-radius:12px;background:#fff;padding:0 11px;color:var(--ink)}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:900;box-shadow:0 4px 8px rgba(50,109,244,.22);white-space:nowrap}.btn.orange{background:var(--orange);box-shadow:0 4px 8px rgba(255,118,37,.2)}.btn.soft{background:#fff;color:#41719b;border:2px solid #cae0f3;box-shadow:none}.task-form{display:grid;grid-template-columns:1fr 1.35fr 1.35fr auto;gap:11px;align-items:end}.hint{font-size:.84rem;color:#778b9c;margin:10px 0 0}.board{display:grid;grid-template-columns:340px 1fr;gap:25px;align-items:start}.students{background:rgba(255,241,244,.93);border:3px solid #fff;border-radius:25px;box-shadow:var(--shadow);padding:20px;position:sticky;top:12px}.students h2{text-align:center;margin:0 0 10px;font-size:1.25rem}.students p{text-align:center;margin:0 0 15px;color:#6a7c8a;font-size:.85rem}.seat-pool{display:flex;flex-wrap:wrap;gap:9px}.seat-chip{border:0;background:var(--yellow);color:#925300;border-radius:999px;width:58px;min-height:45px;padding:6px 4px;font-weight:900;box-shadow:0 4px 7px rgba(91,65,16,.14);touch-action:none}.seat-chip:hover{transform:translateY(-2px)}.seat-chip.dragging{opacity:.45}.seat-chip.used{display:none}.vacancy{background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(228,243,255,.92));border:3px solid #fff;border-radius:29px;box-shadow:0 18px 32px rgba(65,106,140,.2),inset 0 2px 0 #fff;padding:20px}.vacancy-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.vacancy-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.vacancy h2{margin:0;font-size:1.3rem}.status{background:#eaf2ff;color:#5276a4;border-radius:999px;padding:6px 10px;font-size:.82rem}.job-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.job-card{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,#fff 0%,#edf6ff 70%,#dcecff 100%);border:3px solid #fafdff;border-radius:24px;padding:18px 14px 14px;min-height:198px;text-align:center;display:flex;flex-direction:column;box-shadow:0 12px 0 #b8d0e4,0 19px 24px rgba(63,103,138,.2),inset 0 2px 2px rgba(255,255,255,.95);transition:transform .2s ease,box-shadow .2s ease}.job-card:before{content:'';position:absolute;z-index:-1;left:10%;right:10%;top:5px;height:38%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0));pointer-events:none}.job-card:after{content:'✦';position:absolute;right:15px;top:10px;color:#ffc04e;font-size:1.2rem;text-shadow:0 2px 0 #fff}.job-card:hover{transform:translateY(-5px);box-shadow:0 16px 0 #b8d0e4,0 25px 28px rgba(63,103,138,.23),inset 0 2px 2px #fff}.job-card.over{border-color:#ffb15c;background:linear-gradient(145deg,#fffdf3,#ffedd6);box-shadow:0 12px 0 #f2b66e,0 19px 24px rgba(160,101,32,.18)}.job-title{font-size:1.12rem;font-weight:1000;margin:4px 0 6px;text-shadow:0 1px 0 #fff}.job-detail{font-size:.85rem;color:#667c8f;line-height:1.5;min-height:40px;margin:0}.dropzone{display:flex;gap:7px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:62px;padding:7px;border-radius:15px;background:rgba(255,255,255,.48);box-shadow:inset 0 2px 5px rgba(86,136,174,.13)}.dropzone:empty:after{content:'拖曳座號到這裡';color:#8aabc0;font-size:.83rem}.assigned-seat{border:0;border-radius:999px;min-width:46px;padding:9px 8px;background:radial-gradient(circle at 35% 28%,#fffbdc,#ffe98b 64%,#efbd3e);color:#8b4b00;font-weight:1000;box-shadow:0 4px 0 #d6a631,0 7px 8px rgba(91,65,16,.18),inset 0 2px 2px #fff}.card-actions{display:flex;justify-content:center;gap:7px;margin-top:auto;padding-top:11px}.small-btn{border:1px solid #cddced;border-radius:9px;background:#fff;color:#4f7191;padding:6px 8px;font-size:.76rem;font-weight:800}.small-btn.delete{color:#ca5664;border-color:#ffd0d5}.view-panel{margin-top:21px;background:rgba(248,252,255,.92);border-color:#dae6f3}.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.view-head h2{margin:0}.notice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px;margin-top:15px}.notice-card{background:#fff;border:1px solid #e0e9f0;border-radius:14px;padding:12px;text-align:center}.notice-card strong{display:block}.notice-card span{display:block;color:#d6681f;margin-top:6px;font-weight:900}.empty-view{color:#9caab4;text-align:center;padding:20px}.modal{position:fixed;display:none;inset:0;background:rgba(35,62,90,.45);z-index:10;padding:16px;place-items:center}.modal.show{display:grid}.dialog{width:min(590px,100%);max-height:84vh;overflow:auto;background:#fff;border-radius:23px;padding:21px;box-shadow:var(--shadow)}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog h3{margin:0}.close{border:0;border-radius:9px;background:#edf3f7;font-size:1.3rem}.candidate-grid{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.candidate{border:2px solid #dde6ed;border-radius:10px;background:#fff;padding:8px 12px;color:#4f6c82}.candidate.active{background:#fff3b1;border-color:#f3d456;color:#925300}.vote-list{display:grid;gap:8px;margin:14px 0}.vote-row{display:flex;align-items:center;gap:9px;background:#f5f9ff;border-radius:11px;padding:8px 10px}.vote-row b{min-width:46px}.vote-row span{color:#57738c;flex:1}.vote-row button{border:0;border-radius:8px;background:#e4efff;color:#326df4;padding:5px 8px;font-weight:800}.draw-screen{text-align:center;padding:18px 8px}.draw-label{font-weight:900;color:var(--orange);letter-spacing:.12em}.draw-number{font-size:4.3rem;font-weight:1000;color:#326df4;line-height:1.3;text-shadow:3px 3px 0 #dce9ff}.draw-result{min-height:1.5em;font-weight:900;color:#d6681f}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:none;background:#244d69;color:#fff;padding:10px 16px;z-index:20;font-size:.9rem}.toast.show{display:block}@media(max-width:920px){.board{grid-template-columns:1fr}.students{position:static}.job-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.seat-pool{justify-content:center}}@media(max-width:660px){.steps,.task-form{grid-template-columns:1fr 1fr}.steps .btn,.task-form .btn{grid-column:span 2}.job-grid{grid-template-columns:1fr}.panel,.students,.vacancy{padding:15px}.view-head,.vacancy-head{align-items:flex-start;flex-direction:column}.vacancy-actions{justify-content:flex-start}.seat-chip{width:52px}}
  </style>
  <style>
    /* 讓所有操作區也具有同一套 3D 動畫教室質感 */
    .panel, .students, .vacancy, .view-panel, .dialog {
      border-color: rgba(255,255,255,.98);
      box-shadow: 0 14px 0 rgba(215,194,159,.36), 0 24px 38px rgba(83,101,111,.18), inset 0 2px 2px rgba(255,255,255,.95);
      background: linear-gradient(145deg, rgba(255,255,255,.96), rgba(238,247,255,.88));
    }
    .panel::before, .students::before, .view-panel::before {
      content: ""; display: block; height: 6px; width: 55px; border-radius: 999px;
      background: linear-gradient(90deg, #ffc15b, #ff8c5a); box-shadow: 0 3px 0 #d97742; margin: -5px auto 13px;
    }
    .students { background: linear-gradient(145deg, rgba(255,249,253,.97), rgba(255,225,235,.9)); }
    .view-panel { background: linear-gradient(145deg, rgba(248,253,255,.98), rgba(221,240,255,.9)); }
    .control {
      border: 2px solid #eef7ff;
      background: linear-gradient(145deg, #fff, #e7f2fb);
      box-shadow: inset 0 3px 6px rgba(89,133,167,.15), 0 3px 0 #c5dbea;
      border-radius: 16px;
      font-size: 1rem;
    }
    .btn, .small-btn {
      transform: translateY(0);
      border: 2px solid rgba(255,255,255,.8);
      box-shadow: 0 5px 0 rgba(31,77,155,.48), 0 9px 13px rgba(44,82,139,.19), inset 0 2px 2px rgba(255,255,255,.48);
      transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
    }
    .btn:hover, .small-btn:hover { transform: translateY(-2px); filter: saturate(1.1) brightness(1.04); }
    .btn:active, .small-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(31,77,155,.48), inset 0 2px 4px rgba(0,0,0,.13); }
    .btn.orange { box-shadow: 0 5px 0 #c85c22, 0 9px 13px rgba(174,75,25,.21), inset 0 2px 2px rgba(255,255,255,.48); }
    .btn.soft, .small-btn { background: linear-gradient(145deg, #fff, #e7f3ff); }
    .seat-chip {
      background: radial-gradient(circle at 34% 26%, #fffde6, #fff0a7 55%, #f3c54b);
      border: 2px solid #fff8cf;
      box-shadow: 0 5px 0 #d6a631, 0 9px 12px rgba(121,84,22,.18), inset 0 2px 3px #fff;
    }
    .notice-card {
      background: linear-gradient(145deg, #fff, #e9f5ff);
      border: 2px solid #fff;
      border-radius: 19px;
      box-shadow: 0 6px 0 #c7deec, 0 10px 15px rgba(68,104,133,.14), inset 0 2px 2px #fff;
    }
    .status { box-shadow: 0 3px 0 #bcd0e6, inset 0 2px 2px #fff; }
    .modal { backdrop-filter: blur(6px); }
    .dialog { background: linear-gradient(145deg, #fff, #edf7ff); }
    .candidate, .vote-row { box-shadow: 0 3px 0 #c4d9e9, inset 0 1px 1px #fff; }
    .candidate.active { box-shadow: 0 3px 0 #d8af38, inset 0 1px 1px #fff; }
  </style>
</head>
<body>
  <main class="shell">
    <a class="back" href="../index.html">← 返回教學工具箱</a>
    <header class="hero"><h1>班級幹部<span>職缺表</span></h1><p>✨ 拖曳座號選擇，再幫全班職位分配 ✨</p></header>
    <section class="panel"><h2>① 班級設定</h2><div class="steps"><div class="field"><label for="count">班級人數</label><input class="control" id="count" type="number" min="1" max="60" value="30"></div><div class="field"><label for="className">班級名稱（選填）</label><input class="control" id="className" placeholder="例如：五年一班"></div><button class="btn" id="saveClass">儲存班級設定</button></div></section>
    <section class="panel"><h2>② 新增幹部職缺</h2><div class="task-form"><div class="field"><label for="role">職缺名稱</label><select class="control" id="role"><option>班長</option><option>副班長</option><option>風紀股長</option><option>早自習長</option><option>午休長</option><option>衛生股長</option><option>學藝股長</option><option>體育股長</option><option>午餐股長</option><option>健康股長</option><option>漱口長</option><option>作業長</option><option value="其他">其他：手動輸入</option></select></div><div class="field" id="customRoleWrap" hidden><label for="customRole">自訂職缺</label><input class="control" id="customRole" placeholder="輸入職缺名稱"></div><div class="field"><label for="detail">職缺說明</label><input class="control" id="detail" placeholder="選擇職缺後會自動帶入說明"></div><button class="btn orange" id="addRole">＋ 新增職缺</button></div><p class="hint">將左邊的學生座號拖到職缺卡；遇到多人競爭或沒有人選擇，可按職缺卡的「投票／抽籤」。</p></section>
    <section class="board"><aside class="students"><h2>學生座號</h2><p>拖曳座號到右側職缺欄位</p><div class="seat-pool" id="seatPool"></div></aside><section class="vacancy"><div class="vacancy-head"><h2>幹部職位 📋</h2><div class="vacancy-actions"><button class="btn soft" id="saveSettings">💾 儲存目前設定</button><span class="status" id="status">0 個職缺・0 人已分配</span></div></div><div class="job-grid" id="jobGrid"></div></section></section>
    <section class="panel view-panel"><div class="view-head"><div><h2>③ 學生觀看用・班級幹部表</h2><p class="hint">完成分配後，下載 Word 版本張貼於公布欄。</p></div><button class="btn orange" id="download">⇩ 下載 Word 張貼版</button></div><div class="notice-grid" id="noticeGrid"></div></section>
  </main>
  <div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h3 id="modalTitle">投票／抽籤</h3><button class="close" id="close">×</button></div><p class="hint" id="electionHint">先選擇候選人；每位候選人可累積票數，也可直接抽籤決定。候選人不可同時擔任其他職位。</p><div class="draw-screen" id="drawScreen" hidden><div class="draw-label">🎲 抽籤中 🎲</div><div class="draw-number" id="drawNumber">?</div><p class="draw-result" id="drawResult"></p></div><div class="candidate-grid" id="candidateGrid"></div><div class="vote-list" id="voteList"></div><div class="dialog-actions" id="electionActions"><button class="btn soft" id="resetVotes">清除票數</button><button class="btn orange" id="draw">🎲 立即抽籤</button><button class="btn" id="applyVote">採用最高票</button></div></div></div><div class="toast" id="toast"></div>
  <script>
    const KEY='officer-board-v1',icons={班長:'👑',副班長:'🤝',風紀股長:'🧑‍✈️',早自習長:'🌅',午休長:'🌙',衛生股長:'🧹',學藝股長:'🎨',體育股長:'🏃',午餐股長:'🍱',健康股長:'💚',漱口長:'💧',作業長:'📝'},presets={班長:'協助老師，管理班級秩序。',副班長:'協助班長，負責班級事務。',風紀股長:'維持上課紀律與秩序。',早自習長:'協助早自習活動與安靜閱讀。',午休長:'提醒同學安靜午休。',衛生股長:'監督打掃工作與環境整潔。',學藝股長:'管理作業繳交與教室布置。',體育股長:'帶領體育活動，保管體育用品。',午餐股長:'協助午餐秩序與餐桶整理。',健康股長:'協助健康檢查與保健提醒。',漱口長:'提醒同學餐後漱口。',作業長:'協助收齊與發放作業。'};
    let state=load(),activeId=null;const $=id=>document.getElementById(id);function load(){try{return {count:30,className:'',roles:[],...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {count:30,className:'',roles:[]}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function seat(n){return String(n).padStart(2,'0')}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2500)}function used(except){return new Set(state.roles.filter(r=>r.id!==except).flatMap(r=>r.seats))}
    function render(){const taken=used();$('seatPool').innerHTML=Array.from({length:state.count},(_,i)=>{const n=i+1;return `<button class="seat-chip ${taken.has(n)?'used':''}" draggable="true" data-seat="${n}">${seat(n)}</button>`}).join('');document.querySelectorAll('.seat-chip').forEach(chip=>{chip.ondragstart=e=>{e.dataTransfer.setData('seat',chip.dataset.seat);chip.classList.add('dragging')};chip.ondragend=()=>chip.classList.remove('dragging')});$('jobGrid').innerHTML=state.roles.length?state.roles.map(roleCard).join(''):'<p class="empty-view">請先在上方新增幹部職缺。</p>';document.querySelectorAll('.job-card').forEach(card=>{card.ondragover=e=>{e.preventDefault();card.classList.add('over')};card.ondragleave=()=>card.classList.remove('over');card.ondrop=e=>{e.preventDefault();card.classList.remove('over');assign(card.dataset.id,Number(e.dataTransfer.getData('seat')))}});const people=state.roles.reduce((n,r)=>n+r.seats.length,0);$('status').textContent=`${state.roles.length} 個職缺・${people} 人已分配`;$('noticeGrid').innerHTML=state.roles.length?state.roles.map(r=>`<article class="notice-card"><strong>${icons[r.name]||'📌'} ${esc(r.name)}</strong><small>${esc(r.detail||'班級服務')}</small><span>${r.seats.length?r.seats.map(seat).join('、')+' 號':'待選任'}</span></article>`).join(''):'<p class="empty-view">尚未建立幹部職缺。</p>'}
    function roleCard(r){return `<article class="job-card" data-id="${r.id}"><div class="job-title">${icons[r.name]||'📌'} ${esc(r.name)}</div><p class="job-detail">${esc(r.detail||'請填寫職缺說明')}</p><div class="dropzone">${r.seats.map(n=>`<button class="assigned-seat" title="點擊移回學生座號" onclick="release('${r.id}',${n})">${seat(n)}</button>`).join('')}</div><div class="card-actions"><button class="small-btn" onclick="openElection('${r.id}')">🗳 投票／抽籤</button><button class="small-btn delete" onclick="removeRole('${r.id}')">刪除</button></div></article>`}
    function saveClass(){state.count=Math.max(1,Math.min(60,Number($('count').value)||1));state.className=$('className').value.trim();state.roles.forEach(r=>r.seats=r.seats.filter(n=>n<=state.count));save();render();toast('班級設定已儲存')}function addRole(){let name=$('role').value;if(name==='其他')name=$('customRole').value.trim();if(!name){toast('請輸入職缺名稱');return}state.roles.push({id:Date.now().toString(),name,detail:$('detail').value.trim(),seats:[],candidates:[],votes:{}});save();render();$('detail').value=presets[$('role').value]||'';$('customRole').value='';toast('職缺已新增，請拖曳座號分配')}
    function assign(id,n){const role=state.roles.find(r=>r.id===id);if(!role)return;if(used(id).has(n)){toast('這位學生已擔任其他職位');return}if(!role.seats.includes(n))role.seats.push(n);save();render()}window.release=(id,n)=>{const r=state.roles.find(x=>x.id===id);r.seats=r.seats.filter(x=>x!==n);save();render()};window.removeRole=id=>{state.roles=state.roles.filter(r=>r.id!==id);save();render()};
    window.openElection=id=>{activeId=id;const r=state.roles.find(x=>x.id===id);if(r.seats.length){r.candidates=[...r.seats];save()}$('modalTitle').textContent=`${r.name}｜投票／抽籤`;resetDrawScreen();renderElection();$('modal').classList.add('show')};function renderElection(){const r=state.roles.find(x=>x.id===activeId),taken=used(activeId),available=Array.from({length:state.count},(_,i)=>i+1).filter(n=>!taken.has(n)&&!r.seats.includes(n)),preferred=r.seats.length?r.seats:available;$('candidateGrid').innerHTML=preferred.length?preferred.map(n=>r.seats.length?`<span class="candidate active">${seat(n)} 號</span>`:`<button class="candidate ${r.candidates.includes(n)?'active':''}" onclick="toggleCandidate(${n})">${seat(n)} 號</button>`).join(''):'<span class="hint">沒有可選候選人</span>';$('voteList').innerHTML=r.candidates.length?r.candidates.map(n=>`<div class="vote-row"><b>${seat(n)} 號</b><span>${r.votes[n]||0} 票</span><button onclick="vote(${n})">＋ 1 票</button></div>`).join(''):'<p class="hint">請先點選候選人。</p>'}window.toggleCandidate=n=>{const r=state.roles.find(x=>x.id===activeId);r.candidates=r.candidates.includes(n)?r.candidates.filter(x=>x!==n):[...r.candidates,n];save();renderElection()};window.vote=n=>{const r=state.roles.find(x=>x.id===activeId);r.votes[n]=(r.votes[n]||0)+1;save();renderElection()};function resetDrawScreen(){$('drawScreen').hidden=true;$('candidateGrid').hidden=false;$('voteList').hidden=false;$('electionActions').hidden=false;$('electionHint').hidden=false;$('drawResult').textContent=''}function playDraw(pool,winner,r){$('drawScreen').hidden=false;$('candidateGrid').hidden=true;$('voteList').hidden=true;$('electionActions').hidden=true;$('electionHint').hidden=true;const ticker=setInterval(()=>{$('drawNumber').textContent=seat(pool[Math.floor(Math.random()*pool.length)])},95);setTimeout(()=>{clearInterval(ticker);$('drawNumber').textContent=seat(winner);$('drawResult').textContent=`恭喜 ${seat(winner)} 號當選 ${r.name}！`;setTimeout(()=>{assign(activeId,winner);$('modal').classList.remove('show');resetDrawScreen();toast(`${seat(winner)} 號已成為${r.name}`)},1150)},1600)}function elect(mode){const r=state.roles.find(x=>x.id===activeId);let pool=r.seats.length?[...r.seats]:r.candidates.filter(n=>!used(activeId).has(n));if(!pool.length)pool=Array.from({length:state.count},(_,i)=>i+1).filter(n=>!used(activeId).has(n)&&!r.seats.includes(n));if(!pool.length){toast('沒有可分配的學生');return}let winner;if(mode==='vote'){const max=Math.max(...pool.map(n=>r.votes[n]||0));const leaders=pool.filter(n=>(r.votes[n]||0)===max);winner=leaders[Math.floor(Math.random()*leaders.length)];assign(activeId,winner);$('modal').classList.remove('show');toast(`${seat(winner)} 號已成為${r.name}`)}else{winner=pool[Math.floor(Math.random()*pool.length)];playDraw(pool,winner,r)}}
    function download(){const rows=state.roles.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.detail||'班級服務')}</td><td>${r.seats.length?r.seats.map(n=>seat(n)+' 號').join('、'):'待選任'}</td></tr>`).join('');const title=esc((state.className?state.className+'｜':'')+'班級幹部表'),html=`<html><head><meta charset="utf-8"><style>body{font-family:'Microsoft JhengHei';color:#28445d}h1{text-align:center;color:#ff7625}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #b9cee3;padding:12px}th{background:#e9f2ff;color:#326df4}</style></head><body><h1>${title}</h1><p style="text-align:center">一起服務班級、一起成長！</p><table><thead><tr><th>職位</th><th>工作內容</th><th>擔任同學</th></tr></thead><tbody>${rows}</tbody></table></body></html>`,blob=new Blob(['\ufeff',html],{type:'application/msword'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(state.className||'班級')+'幹部表.doc';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('Word 張貼版已下載')}
    function setPreset(){const role=$('role').value;$('customRoleWrap').hidden=role!=='其他';if(role!=='其他')$('detail').value=presets[role]||''}function saveSettings(){save();toast('目前設定已儲存，下次開啟會自動帶入')}$('count').value=state.count;$('className').value=state.className;$('saveClass').onclick=saveClass;$('saveSettings').onclick=saveSettings;$('addRole').onclick=addRole;$('role').onchange=setPreset;$('close').onclick=()=>{$('modal').classList.remove('show');resetDrawScreen()};$('modal').onclick=e=>{if(e.target===$('modal')){$('modal').classList.remove('show');resetDrawScreen()}};$('resetVotes').onclick=()=>{const r=state.roles.find(x=>x.id===activeId);r.votes={};save();renderElection()};$('draw').onclick=()=>elect('draw');$('applyVote').onclick=()=>elect('vote');$('download').onclick=download;setPreset();render();
  </script>
</body>
