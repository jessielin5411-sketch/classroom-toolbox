<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>班級打掃分配站｜教學微光站</title>
  <style>
    :root{--ink:#264359;--green:#19bd72;--mint:#e8fbf0;--line:#b6efd0;--blue:#e9f7ff;--blue-line:#b8e5fa;--paper:#fff;--soft:0 13px 28px rgba(37,81,82,.12)}
    *{box-sizing:border-box} body{margin:0;color:var(--ink);background:radial-gradient(circle at 10% 5%,#fff1ae 0,transparent 22rem),radial-gradient(circle at 91% 25%,#dff9ef 0,transparent 25rem),#fffdf5;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
    button,input,select{font:inherit} button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:26px 18px 54px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.back{color:#348168;text-decoration:none;font-size:.92rem}.brand{display:flex;gap:12px;align-items:center}.brand-icon{font-size:1.8rem;background:#d9fae6;width:52px;height:52px;display:grid;place-items:center;border-radius:18px}.brand h1{font-size:clamp(1.4rem,4vw,2rem);margin:0;color:#118956}.brand p{margin:3px 0 0;color:#68808b;font-size:.9rem}.panel{background:rgba(255,255,255,.94);border:3px solid var(--line);border-radius:27px;padding:25px;box-shadow:var(--soft);margin-bottom:22px}.panel h2{font-size:1.18rem;margin:0 0 18px;color:#167e57}.settings-row,.add-grid{display:grid;grid-template-columns:1.05fr 1.45fr 1.45fr .65fr auto;gap:12px;align-items:end}.field{min-width:0}.field label{display:block;font-size:.88rem;font-weight:800;color:#16835a;margin:0 0 7px}.control{width:100%;height:47px;border:2px solid #9beabf;border-radius:13px;background:#fff;padding:0 12px;color:var(--ink)}.capacity{max-width:115px;text-align:center}.btn{border:0;border-radius:14px;padding:12px 17px;font-weight:800;color:#fff;background:#18bc6c;box-shadow:0 5px 10px rgba(20,158,86,.21);white-space:nowrap}.btn:hover{filter:brightness(.96)}.btn.secondary{background:#fff;color:#16835a;border:2px solid #a6eac2;box-shadow:none}.note{font-size:.86rem;color:#69818a;margin:11px 0 0}.work-header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #dce9eb;padding-bottom:13px;margin-bottom:18px}.work-header h2{margin:0;color:#315166}.header-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.badge{background:#edf4f7;border-radius:999px;padding:6px 12px;color:#527084;font-size:.86rem}.zones{display:grid;grid-template-columns:1fr 1fr;gap:20px}.zone{border:2px solid;border-radius:24px;padding:15px;min-height:220px}.zone.inner{background:var(--blue);border-color:var(--blue-line)}.zone.outer{background:var(--mint);border-color:#b9efd4}.zone-title{font-size:1rem;font-weight:900;margin:0 0 12px;display:flex;gap:8px;align-items:center}.dot{width:12px;height:12px;border-radius:50%;background:#32baf4}.outer .dot{background:#30c990}.task{background:#fff;border-radius:17px;padding:13px;margin:10px 0;box-shadow:0 4px 11px rgba(42,87,97,.08)}.task-top{display:flex;align-items:center;gap:8px}.place{background:#d9effe;color:#247ba0;padding:5px 9px;border-radius:7px;font-weight:800;font-size:.84rem}.outer .place{background:#d8f8e7;color:#168259}.task-name{font-weight:900}.task-meta{margin-left:auto;color:#69808d;font-size:.83rem;white-space:nowrap}.task-actions{border:0;background:none;color:#95aab7;font-size:1.2rem;padding:3px 5px}.assigned{margin-top:11px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.assigned-label{font-size:.8rem;color:#7a93a0}.seat{border:0;background:#fff1bb;color:#a46c00;border-radius:999px;padding:4px 8px;font-size:.8rem}.seat.remove{cursor:pointer}.select-seat{border:1px dashed #a8c7d6;color:#4d778f;border-radius:999px;padding:4px 9px;background:#fff;font-size:.8rem}.empty{font-size:.9rem;color:#698391;margin:22px 4px}.preview{background:linear-gradient(135deg,#fffdf7,#f5fffb);border-color:#d7e8df}.preview-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:17px}.preview-head h2{margin:0}.student-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}.student-card{background:#fff;border:1px solid #dcece5;border-radius:16px;padding:13px;min-height:103px}.student-seat{font-weight:900;color:#14905b}.student-task{font-size:.88rem;line-height:1.55;margin:8px 0 0}.student-task span{display:inline-block;background:#e8f8ef;color:#33765b;border-radius:5px;padding:1px 5px;margin:2px 2px 0 0}.unassigned{color:#a3abb0;font-size:.88rem;margin-top:12px}.legend{font-size:.82rem;color:#6b8288;margin:0}.modal{position:fixed;inset:0;background:rgba(24,53,64,.42);display:none;place-items:center;padding:18px;z-index:10}.modal.show{display:grid}.modal-box{max-width:620px;width:100%;max-height:82vh;overflow:auto;background:#fff;border-radius:24px;padding:22px;box-shadow:var(--soft)}.modal-top{display:flex;justify-content:space-between;align-items:center}.modal h3{margin:0}.close{border:0;background:#eef6f5;border-radius:9px;font-size:1.35rem}.seat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(65px,1fr));gap:9px;margin:18px 0}.seat-choice{padding:9px 4px;border:2px solid #cfe4df;background:#fff;border-radius:10px;color:#417168}.seat-choice.selected{background:#19bd72;color:#fff;border-color:#19bd72}.seat-choice:disabled{cursor:not-allowed;background:#edf1f2;color:#a4b0b4;border-color:#dce4e6;text-decoration:line-through}.modal-actions{display:flex;justify-content:flex-end;gap:9px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#234d52;color:#fff;padding:10px 17px;border-radius:999px;display:none;z-index:20;font-size:.9rem}.toast.show{display:block}@media(max-width:800px){.settings-row,.add-grid{grid-template-columns:1fr 1fr}.settings-row .btn,.add-grid .btn{grid-column:span 2}.zones{grid-template-columns:1fr}.panel{padding:17px}.top{align-items:flex-start}.preview-head{align-items:flex-start;flex-direction:column}}@media(max-width:440px){.settings-row,.add-grid{grid-template-columns:1fr}.settings-row .btn,.add-grid .btn{grid-column:auto}.top{flex-direction:column}.work-header{align-items:flex-start;flex-direction:column}.header-actions{justify-content:flex-start}.task-top{flex-wrap:wrap}.task-meta{margin-left:0}.student-board{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div class="brand"><div class="brand-icon">🧹</div><div><h1>班級打掃分配站</h1><p>快速安排值日任務，清楚展示給全班同學。</p></div></div><a class="back" href="../index.html">← 返回教學工具箱</a></div>
    <section class="panel"><h2>① 班級設定</h2><div class="settings-row"><div class="field"><label for="studentCount">班級人數</label><input class="control" id="studentCount" type="number" min="1" max="60" value="30"></div><div class="field"><label for="className">班級名稱（選填）</label><input class="control" id="className" placeholder="例如：五年一班"></div><div class="note">設定後會產生 01 起的座號選項。</div><button class="btn" id="saveClass">儲存班級設定</button></div></section>
    <section class="panel"><h2>② 設定打掃任務</h2><div class="add-grid"><div class="field"><label for="zone">掃區類別</label><select class="control" id="zone"><option value="inner">內掃區</option><option value="outer">外掃區</option></select></div><div class="field"><label for="place">地點／掃區</label><input class="control" id="place" placeholder="例如：教室、走廊、花圃"></div><div class="field"><label for="job">要做什麼</label><select class="control" id="job"><option>掃地</option><option>拖地</option><option>倒垃圾＆回收</option><option>擦黑板</option><option>擦玻璃</option><option>整理桌椅</option><option>走廊巡視</option><option value="其他">其他：手動輸入</option></select></div><div class="field" id="customJobWrap" hidden><label for="customJob">其他任務</label><input class="control" id="customJob" placeholder="輸入任務"></div><div class="field"><label for="people">執行人數</label><input class="control capacity" id="people" type="number" min="1" max="20" value="1"></div><button class="btn" id="addTask">＋ 加入任務</button></div><p class="note">加入後，點選「選擇座號」即可指定負責同學；同一位學生可依需要安排多項任務。</p></section>
    <section class="panel work"><div class="work-header"><h2>③ 工作清單</h2><div class="header-actions"><button class="btn secondary" id="autoAssign">⚡ 一鍵自動分配</button><span class="badge" id="summary">總需 0 人／已分配 0 人</span></div></div><div class="zones"><div class="zone inner"><p class="zone-title"><i class="dot"></i>內掃區</p><div id="innerTasks"></div></div><div class="zone outer"><p class="zone-title"><i class="dot"></i>外掃區</p><div id="outerTasks"></div></div></div></section>
    <section class="panel preview"><div class="preview-head"><div><h2>④ 學生觀看用・打掃分配圖</h2><p class="legend">每位同學依座號查看今天負責的工作。</p></div><button class="btn" id="downloadWord">⇩ 下載 Word 張貼版</button></div><div id="studentBoard" class="student-board"></div></section>
  </main>
  <div class="modal" id="modal"><div class="modal-box"><div class="modal-top"><h3 id="modalTitle">選擇座號</h3><button class="close" id="closeModal" aria-label="關閉">×</button></div><p class="note">點選座號即可勾選或取消。已選人數會顯示在任務卡上。</p><div class="seat-grid" id="seatGrid"></div><div class="modal-actions"><button class="btn secondary" id="cancelModal">取消</button><button class="btn" id="confirmSeats">完成選擇</button></div></div></div><div class="toast" id="toast"></div>
  <script>
    const KEY='cleaning-station-v1', defaults={count:30,className:'',tasks:[]}; let state=load(),editingId=null,draftSeats=[];const $=id=>document.getElementById(id);
    function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {...defaults}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function seat(n){return String(n).padStart(2,'0')}function showToast(text){const t=$('toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}function setInitial(){$('studentCount').value=state.count;$('className').value=state.className}
    function render(){['inner','outer'].forEach(zone=>{const holder=$(zone+'Tasks'),tasks=state.tasks.filter(t=>t.zone===zone);holder.innerHTML=tasks.length?tasks.map(taskCard).join(''):'<p class="empty">尚未加入任務</p>'});const required=state.tasks.reduce((sum,t)=>sum+Number(t.people),0),assigned=state.tasks.reduce((sum,t)=>sum+t.seats.length,0);$('summary').textContent=`總需 ${required} 人／已分配 ${assigned} 人`;const assignments=Array.from({length:state.count},()=>[]);state.tasks.forEach(t=>t.seats.forEach(n=>assignments[n-1]?.push(t)));$('studentBoard').innerHTML=assignments.map((jobs,i)=>`<article class="student-card"><div class="student-seat">${seat(i+1)} 號</div>${jobs.length?'<div class="student-task">'+jobs.map(t=>`<span>${esc(t.place)}・${esc(t.job)}</span>`).join('')+'</div>':'<div class="unassigned">尚未安排</div>'}</article>`).join('')}
    function taskCard(t){return `<article class="task"><div class="task-top"><span class="place">${esc(t.place)}</span><strong class="task-name">${esc(t.job)}</strong><span class="task-meta">需 ${t.people} 人｜已選 ${t.seats.length}</span><button class="task-actions" onclick="removeTask('${t.id}')" title="刪除任務">⌫</button></div><div class="assigned"><span class="assigned-label">負責：</span>${t.seats.length?t.seats.map(n=>`<button class="seat remove" onclick="quickRemove('${t.id}',${n})">${seat(n)} ×</button>`).join(''):'<span class="assigned-label">尚未選擇</span>'}<button class="select-seat" onclick="openSeats('${t.id}')">＋ 選擇座號</button></div></article>`}
    function saveClass(){const count=Math.max(1,Math.min(60,Number($('studentCount').value)||1));state.count=count;state.className=$('className').value.trim();state.tasks.forEach(t=>t.seats=t.seats.filter(n=>n<=count));save();render();showToast('班級設定已儲存')}function addTask(){let job=$('job').value;if(job==='其他')job=$('customJob').value.trim();const place=$('place').value.trim(),people=Math.max(1,Number($('people').value)||1);if(!place||!job){showToast('請先填寫掃區與任務內容');return}state.tasks.push({id:Date.now().toString(),zone:$('zone').value,place,job,people,seats:[]});save();render();$('place').value='';$('customJob').value='';showToast('任務已加入，接著可選擇座號')}
    function uniqueAssignments(){const used=new Set();state.tasks.forEach(t=>t.seats=t.seats.filter(n=>!used.has(n)&&(used.add(n),true)))}function occupiedSeats(excludeId){return new Set(state.tasks.filter(t=>t.id!==excludeId).flatMap(t=>t.seats))}function autoAssign(){uniqueAssignments();const used=occupiedSeats(),free=Array.from({length:state.count},(_,i)=>i+1).filter(n=>!used.has(n));state.tasks.forEach(t=>{let needed=Math.max(0,t.people-t.seats.length);while(needed--&&free.length)t.seats.push(free.shift())});save();render();const unassigned=free.length,unfilled=state.tasks.reduce((sum,t)=>sum+Math.max(0,t.people-t.seats.length),0);showToast(unfilled?`任務人數不足，仍有 ${unfilled} 個名額待安排`:(unassigned?`已完成分配；尚有 ${unassigned} 位學生未排入任務`:'全班任務已自動分配完成'))};window.removeTask=id=>{state.tasks=state.tasks.filter(t=>t.id!==id);save();render()};window.quickRemove=(id,n)=>{const t=state.tasks.find(t=>t.id===id);t.seats=t.seats.filter(x=>x!==n);save();render()};window.openSeats=id=>{editingId=id;draftSeats=[...(state.tasks.find(t=>t.id===id)?.seats||[])];renderSeatGrid();$('modal').classList.add('show')};function renderSeatGrid(){const blocked=occupiedSeats(editingId);$('seatGrid').innerHTML=Array.from({length:state.count},(_,i)=>{let n=i+1,unavailable=blocked.has(n);return `<button class="seat-choice ${draftSeats.includes(n)?'selected':''}" ${unavailable?'disabled title="已分配其他任務"':''} onclick="toggleSeat(${n})">${seat(n)} 號</button>`}).join('')}window.toggleSeat=n=>{draftSeats=draftSeats.includes(n)?draftSeats.filter(x=>x!==n):[...draftSeats,n].sort((a,b)=>a-b);renderSeatGrid()};function closeModal(){$('modal').classList.remove('show');editingId=null}function confirmSeats(){const t=state.tasks.find(t=>t.id===editingId);if(t){t.seats=draftSeats;uniqueAssignments();save();render();if(draftSeats.length!==t.people)showToast(`已選 ${draftSeats.length} 人（此任務預設需 ${t.people} 人）`)}closeModal()}
    function wordExport(){const assignments=Array.from({length:state.count},()=>[]);state.tasks.forEach(t=>t.seats.forEach(n=>assignments[n-1]?.push(t)));const rows=assignments.map((jobs,i)=>`<tr><td><b>${seat(i+1)} 號</b></td><td>${jobs.length?jobs.map(t=>`${esc(t.zone==='inner'?'內掃區':'外掃區')}｜${esc(t.place)}－${esc(t.job)}`).join('<br>'):'尚未安排'}</td></tr>`).join('');const title=`${esc(state.className?state.className+'｜':'')}班級打掃分配表`,html=`<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:'Microsoft JhengHei',sans-serif;color:#244}h1{text-align:center;color:#16875c}p{text-align:center;color:#687}table{border-collapse:collapse;width:100%;margin-top:18px}th{background:#dff7e9}th,td{border:1px solid #8fcfb0;padding:10px;text-align:left}td:first-child{width:23%;text-align:center;color:#16875c}footer{margin-top:26px;text-align:right;color:#777}</style></head><body><h1>${title}</h1><p>值日生請依照座號完成分配任務</p><table><thead><tr><th>座號</th><th>今日負責工作</th></tr></thead><tbody>${rows}</tbody></table><footer>班級打掃分配站製作</footer></body></html>`;const blob=new Blob(['\ufeff',html],{type:'application/msword'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(state.className||'班級')+'打掃分配表.doc';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);showToast('Word 張貼版已下載')}
    $('saveClass').onclick=saveClass;$('addTask').onclick=addTask;$('autoAssign').onclick=autoAssign;$('job').onchange=()=>$('customJobWrap').hidden=$('job').value!=='其他';$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('confirmSeats').onclick=confirmSeats;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('downloadWord').onclick=wordExport;uniqueAssignments();save();setInitial();render();
  </script>
</body>
</html>
