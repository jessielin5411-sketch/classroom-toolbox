<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>國小教師 AI 提示詞大全</title>
  <style>
    :root {
      --ink: #21304a;
      --muted: #687991;
      --paper: #fbfcff;
      --panel: rgba(255, 255, 255, 0.9);
      --line: rgba(84, 112, 148, 0.16);
      --blue: #69b8ff;
      --green: #83d9a6;
      --yellow: #ffe38a;
      --pink: #ffb4cb;
      --purple: #cbb8ff;
      --orange: #ffc587;
      --shadow: 0 18px 42px rgba(73, 92, 122, 0.16);
      --card-color: #dbeafe;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 12%, rgba(255, 227, 138, 0.8), transparent 24%),
        radial-gradient(circle at 88% 10%, rgba(203, 184, 255, 0.62), transparent 24%),
        radial-gradient(circle at 80% 88%, rgba(131, 217, 166, 0.34), transparent 28%),
        linear-gradient(180deg, #f7fbff, #fff8fb);
    }

    button,
    input {
      font: inherit;
    }

    .page {
      width: min(1180px, calc(100% - 24px));
      margin: 0 auto;
      padding: 18px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .back-link,
    .small-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #4862a8;
      background: rgba(255, 255, 255, 0.82);
      font-weight: 950;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(73, 92, 122, 0.08);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(22px, 4vw, 42px);
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "✦";
      position: absolute;
      right: 34px;
      bottom: 16px;
      color: rgba(105, 184, 255, 0.28);
      font-size: 120px;
      line-height: 1;
      pointer-events: none;
    }

    h1 {
      max-width: 860px;
      margin: 0;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .lead {
      max-width: 820px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.65;
      font-weight: 800;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 12px;
      margin-top: 22px;
      align-items: start;
    }

    .search-box {
      min-height: 48px;
      width: 100%;
      padding: 0 16px;
      border: 2px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: #fff;
      font-weight: 850;
      outline: 0;
    }

    .search-box:focus {
      border-color: rgba(105, 184, 255, 0.8);
      box-shadow: 0 0 0 4px rgba(105, 184, 255, 0.16);
    }

    .tag-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 18px;
    }

    .tag {
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid transparent;
      border-radius: 999px;
      color: #324869;
      background: var(--tag-bg, #edf4ff);
      cursor: pointer;
      font-size: 14px;
      font-weight: 950;
    }

    .tag.active {
      color: #fff;
      background: #263b5e;
      box-shadow: 0 8px 18px rgba(38, 59, 94, 0.2);
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 2px 10px;
      color: var(--muted);
      font-weight: 900;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .prompt-card {
      position: relative;
      display: grid;
      gap: 12px;
      min-height: 310px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 14px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--card-color), white 18%), rgba(255, 255, 255, 0.88));
      box-shadow: var(--shadow);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .category {
      display: inline-flex;
      width: fit-content;
      padding: 5px 10px;
      border-radius: 999px;
      color: #243047;
      background: rgba(255, 255, 255, 0.66);
      font-size: 13px;
      font-weight: 950;
    }

    .copy-button {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      color: #314261;
      background: rgba(255, 255, 255, 0.76);
      cursor: pointer;
      font-size: 18px;
      font-weight: 1000;
    }

    .prompt-card h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
    }

    .prompt-text {
      margin: 0;
      padding: 14px;
      border-radius: 10px;
      color: #1f2d44;
      background: rgba(255, 255, 255, 0.72);
      font-size: 16px;
      line-height: 1.65;
      font-weight: 800;
      white-space: pre-wrap;
    }

    .expected {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin: 0;
      padding: 11px 12px;
      border-radius: 10px;
      color: #455978;
      background: rgba(255, 255, 255, 0.58);
      font-size: 14px;
      line-height: 1.55;
      font-weight: 900;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 32px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.8);
      color: var(--muted);
      text-align: center;
      font-weight: 900;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      transform: translateY(18px);
      opacity: 0;
      padding: 12px 16px;
      border-radius: 999px;
      color: #fff;
      background: #263b5e;
      box-shadow: 0 16px 36px rgba(38, 59, 94, 0.24);
      font-weight: 950;
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 860px) {
      .controls,
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="back-link" href="../index.html">← 回教學微光站</a>
      <button class="small-action" id="copyAllButton" type="button">複製目前清單</button>
    </header>

    <main>
      <section class="hero" aria-labelledby="pageTitle">
        <h1 id="pageTitle">國小教師 AI 提示詞大全</h1>
        <p class="lead">把常見的課堂、行政與親師溝通需求整理成即戰力提示詞。先選情境，再點卡片右上角即可複製，貼到 AI 工具後替換中括號內容。</p>
        <div class="controls">
          <input class="search-box" id="searchInput" type="search" placeholder="搜尋：評語、校外教學、閱讀理解、班親會...">
          <button class="small-action" id="resetButton" type="button">顯示全部</button>
        </div>
        <div class="tag-bar" id="tagBar"></div>
      </section>

      <div class="meta-row">
        <span id="resultCount"></span>
        <span>點擊卡片右上角圖示即可複製</span>
      </div>

      <section class="grid" id="promptGrid" aria-live="polite"></section>
    </main>
  </div>

  <div class="toast" id="toast">已複製提示詞</div>

  <script>
    const categories = [
      { id: "all", label: "全部", color: "#edf4ff" },
      { id: "teaching", label: "教學與備課", color: "#dceeff" },
      { id: "assessment", label: "評量與測驗", color: "#fff0b8" },
      { id: "comments", label: "學生評語", color: "#e5f8df" },
      { id: "classroom", label: "班級經營", color: "#ffd9d9" },
      { id: "parents", label: "親師溝通", color: "#ffe1b8" },
      { id: "admin", label: "行政庶務", color: "#e7dcff" },
      { id: "guidance", label: "輔導與特教", color: "#d7f7f0" }
    ];

    const prompts = [
      {
        id: 1,
        category: "teaching",
        title: "撰寫單元課程計畫",
        prompt: "請幫我寫一份適合國小 [幾] 年級的 [科目] 課程計畫，單元主題是「[填入主題]」。請以 40 分鐘為一節課，規劃出包含「引起動機、發展活動、綜合活動」的教學流程，並列出對應的學習目標。",
        expected: "產出一堂課的完整教案草稿。",
        color: "#bfe2ff"
      },
      {
        id: 2,
        category: "comments",
        title: "期末成績單評語生成",
        prompt: "請根據以下學生的特質（例如：熱心助人、數學邏輯強、但上課容易分心），幫我寫一段約 80-100 字、語氣溫暖且正向鼓勵的期末成績單評語。請用「發現亮點」加上「溫和期許」的結構來撰寫。",
        expected: "快速生成客製化且不落俗套的學生評語。",
        color: "#c8f0c2"
      },
      {
        id: 3,
        category: "parents",
        title: "班親會家長邀請函",
        prompt: "下週即將舉辦國小 [幾] 年級的班親會，請幫我草擬一封給家長的邀請函。語氣要誠懇親切，內容需包含：歡迎家長參與、本學期班級經營核心理念、當天預計討論的重點，以及回條格式。",
        expected: "產出格式完整且親切的正式信函。",
        color: "#ffc7a4"
      },
      {
        id: 4,
        category: "classroom",
        title: "學生衝突處理引導",
        prompt: "班上有兩位學生因為 [填入衝突事件，例如：下課搶球] 發生爭執。請運用社會情緒學習（SEL）與非暴力溝通的原則，幫我設計一段 3 分鐘的師生對話腳本，引導他們說出自己的感受並找出解決方案。",
        expected: "提供教師具體的溝通話術與引導步驟。",
        color: "#ffb8b8"
      },
      {
        id: 5,
        category: "admin",
        title: "校外教學行程與檢核表",
        prompt: "我要帶國小六年級學生去 [填入地點] 進行半天的校外教學。請幫我列出一份包含時間軸的行程規劃表，以及一份給老師的行前安全與物品檢核清單。",
        expected: "產出具體的行程表與防呆檢核清單。",
        color: "#d9c7ff"
      },
      {
        id: 6,
        category: "assessment",
        title: "閱讀理解測驗出題",
        prompt: "請根據以下這篇短文：[貼上課文或文章]，出 5 題適合國小 [幾] 年級程度的閱讀理解選擇題。題目需包含擷取訊息、統整解釋與省思評鑑的層次，並附上解答與簡單解析。",
        expected: "自動化生成符合素養導向的測驗題。",
        color: "#c2e7ff"
      },
      {
        id: 7,
        category: "teaching",
        title: "教學互動網頁製作",
        prompt: "我想製作一個適合國小 [幾] 年級、主題為「[填入單元主題]」的教學互動網頁。請幫我規劃網頁功能與版面，需包含：學習目標、操作流程、學生互動任務、即時回饋方式，以及適合投影或平板操作的介面建議。若可以，請提供 HTML、CSS、JavaScript 的基本架構。",
        expected: "產出可交給 AI 或工程工具繼續製作的互動網頁規格與雛形。",
        color: "#b9e7ff"
      },
      {
        id: 8,
        category: "teaching",
        title: "成語漫畫生成",
        prompt: "請幫我把成語「[填入成語]」設計成適合國小學生理解的四格漫畫腳本。內容需包含：每一格的畫面描述、角色對話、旁白、成語意思，以及最後一格的生活情境應用。請避免過於艱深的文字，語氣要活潑有趣。",
        expected: "生成可用於學習單、簡報或 AI 繪圖的成語漫畫腳本。",
        color: "#ffe4a8"
      },
      {
        id: 9,
        category: "teaching",
        title: "教學單元簡報內容",
        prompt: "請幫我設計一份國小 [幾] 年級 [科目] 的教學簡報大綱，單元主題是「[填入主題]」。請規劃 8-10 張投影片，每張需包含：標題、重點內容、教師講解提示、學生互動提問，以及可搭配的圖片或圖示建議。語氣要清楚、適合課堂投影使用。",
        expected: "產出可直接整理成簡報的逐頁內容架構。",
        color: "#d7d0ff"
      },
      {
        id: 10,
        category: "teaching",
        title: "學習單設計",
        prompt: "請幫我設計一份適合國小 [幾] 年級 [科目] 的學習單，主題是「[填入單元主題]」。請包含：學習目標、暖身題、核心練習題、延伸挑戰題、反思提問，以及教師可快速檢核的答案或評分重點。版面要適合 A4 一頁或兩頁列印。",
        expected: "產出可直接整理成紙本或電子學習單的內容草稿。",
        color: "#d9f7c8"
      },
      {
        id: 11,
        category: "teaching",
        title: "差異化教學活動設計",
        prompt: "請針對國小 [幾] 年級 [科目] 的「[填入單元主題]」，設計一份差異化教學活動。請依照學生程度分成「基礎支持、一般任務、進階挑戰」三層，分別提供任務說明、教師引導語、所需材料、完成標準與可能的協助方式。",
        expected: "產出同一主題下可照顧不同程度學生的分層活動設計。",
        color: "#fff0a8"
      },
      {
        id: 12,
        category: "teaching",
        title: "學習單題目分層改寫",
        prompt: "我有一份國小 [幾] 年級 [科目] 學習單，主題是「[填入主題]」。請幫我把同一個學習目標改寫成三種難度的題目：基礎題、標準題、挑戰題。每一層請提供 3 題，並附上教師檢核重點與學生常見錯誤提醒。",
        expected: "快速生成可用於補救、一般練習與高成就挑戰的分層題目。",
        color: "#cce9ff"
      },
      {
        id: 13,
        category: "assessment",
        title: "素養導向數學題組",
        prompt: "請以國小 [幾] 年級 [數學單元] 為主題，設計一組生活情境題。題目需包含情境描述、3 題由易到難的問題、評分重點與參考解答，並避免只考計算，需看出學生的理解與推理。",
        expected: "產出可直接放入學習單或測驗卷的題組。",
        color: "#ffe9a8"
      },
      {
        id: 14,
        category: "guidance",
        title: "學生情緒 SEL 引導對話",
        prompt: "有一位學生今天看起來情緒低落，原因可能是 [簡述事件]。請幫我設計一段 5 分鐘的教師關懷對話，使用同理、命名情緒、選擇下一步行動的方式，引導學生穩定情緒。",
        expected: "提供教師可直接使用的溫和對話腳本。",
        color: "#c9f3ea"
      },
      {
        id: 15,
        category: "classroom",
        title: "班規與獎勵機制設計",
        prompt: "請幫我設計一套適合國小 [幾] 年級的班級規範與正向獎勵制度。請包含 5 條清楚可執行的班規、違規後的修復式處理方式，以及能鼓勵全班合作的集點獎勵機制。",
        expected: "產出清楚、溫和且可操作的班級經營草案。",
        color: "#ffd0d0"
      },
      {
        id: 16,
        category: "parents",
        title: "聯絡簿事件委婉表達",
        prompt: "請把以下校園事件改寫成適合寫在聯絡簿給家長看的文字：[貼上事件描述]。請使用台灣國小教師常用語氣，先肯定孩子，再客觀描述事件，最後提出希望家長協助引導的方向。",
        expected: "生成溫和、專業且具體的親師溝通文字。",
        color: "#ffd9b5"
      },
      {
        id: 17,
        category: "assessment",
        title: "單元測驗快速出題",
        prompt: "請依據國小 [幾] 年級 [科目] 的「[單元名稱]」，幫我設計一份 20 分鐘的小測驗。題型需包含選擇題、填充題與簡答題，難度分成基礎、熟練、挑戰三層，並附上答案與簡短解析。",
        expected: "產出可直接修改成紙本測驗或線上表單的題目草稿。",
        color: "#ffe9a8"
      },
      {
        id: 18,
        category: "assessment",
        title: "表現任務評分量表",
        prompt: "請幫我設計一份國小 [幾] 年級 [科目] 的表現任務評分量表，任務主題是「[任務名稱]」。請用 4 個等第描述學生表現，評分向度需包含內容理解、表達清楚度、合作參與與作品完成度，並提供學生看得懂的語句。",
        expected: "產出可用於專題、口頭報告或作品評量的 Rubric。",
        color: "#fff1b8"
      },
      {
        id: 19,
        category: "comments",
        title: "日常表現正向紀錄",
        prompt: "請根據以下學生今天的日常表現：[填入觀察，例如：主動協助同學、上課發言踴躍、打掃認真]，幫我寫一段 50-80 字的正向紀錄。語氣要溫暖具體，可用於聯絡簿、班級平台或老師備忘。",
        expected: "快速生成具體、不空泛的日常表現紀錄。",
        color: "#d9f7c8"
      },
      {
        id: 20,
        category: "comments",
        title: "需努力行為的溫和評語",
        prompt: "請把學生的需努力表現：[填入狀況，例如：容易分心、常忘記帶學用品、與同儕互動有摩擦]，改寫成適合老師紀錄或評語使用的文字。請避免負面標籤，改用「可以一起努力的成長目標」來表達，並加入一個具體建議。",
        expected: "產出兼顧溫柔與專業的日常表現評語。",
        color: "#e5f8df"
      },
      {
        id: 21,

    const tagBar = document.querySelector("#tagBar");
    const promptGrid = document.querySelector("#promptGrid");
    const searchInput = document.querySelector("#searchInput");
    const resetButton = document.querySelector("#resetButton");
    const copyAllButton = document.querySelector("#copyAllButton");
    const resultCount = document.querySelector("#resultCount");
    const toast = document.querySelector("#toast");

    let activeCategory = "all";

    function categoryInfo(id) {
      return categories.find((item) => item.id === id) || categories[0];
    }

    function filteredPrompts() {
      const keyword = searchInput.value.trim().toLowerCase();
      return prompts.filter((item) => {
        const matchCategory = activeCategory === "all" || item.category === activeCategory;
        const text = `${item.title} ${item.prompt} ${item.expected} ${categoryInfo(item.category).label}`.toLowerCase();
        return matchCategory && (!keyword || text.includes(keyword));
      });
    }

    function renderTags() {
      tagBar.innerHTML = "";
      categories.forEach((category) => {
        const button = document.createElement("button");
        button.className = `tag ${activeCategory === category.id ? "active" : ""}`;
        button.type = "button";
        button.textContent = category.label;
        button.style.setProperty("--tag-bg", category.color);
        button.addEventListener("click", () => {
          activeCategory = category.id;
          render();
        });
        tagBar.appendChild(button);
      });
    }

    function renderCards() {
      const list = filteredPrompts();
      resultCount.textContent = `目前顯示 ${list.length} 張提示詞卡`;
      promptGrid.innerHTML = "";
      if (!list.length) {
        promptGrid.innerHTML = '<div class="empty">找不到符合條件的提示詞，換個分類或關鍵字試試。</div>';
        return;
      }
      list.forEach((item) => {
        const category = categoryInfo(item.category);
        const card = document.createElement("article");
        card.className = "prompt-card";
        card.style.setProperty("--card-color", item.color);
        card.innerHTML = `
          <div class="card-head">
            <span class="category">${category.label}</span>
            <button class="copy-button" type="button" aria-label="複製 ${item.title}">⧉</button>
          </div>
          <h2>#${item.id} ${item.title}</h2>
          <p class="prompt-text">${item.prompt}</p>
          <p class="expected"><span>💡</span><span>預期結果：${item.expected}</span></p>
        `;
        card.querySelector(".copy-button").addEventListener("click", () => copyText(item.prompt));
        promptGrid.appendChild(card);
      });
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast("已複製提示詞");
      } catch {
        showToast("瀏覽器不允許複製，請手動選取文字");
      }
    }

    async function copyCurrentList() {
      const text = filteredPrompts()
        .map((item) => `【${categoryInfo(item.category).label}】${item.title}\n${item.prompt}\n預期結果：${item.expected}`)
        .join("\n\n---\n\n");
      if (!text) return;
      await copyText(text);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1600);
    }

    function render() {
      renderTags();
      renderCards();
    }

    searchInput.addEventListener("input", renderCards);
    resetButton.addEventListener("click", () => {
      activeCategory = "all";
      searchInput.value = "";
      render();
    });
    copyAllButton.addEventListener("click", copyCurrentList);

    render();
  </script>
