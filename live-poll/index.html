<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星光即時投票站</title>
  <style>
    :root{--ink:#27354f;--muted:#687793;--purple:#7e66e8;--blue:#4a9cf5;--pink:#ff7db7;--yellow:#ffc94d;--mint:#5ed5ae;--paper:#f5f8ff;--shadow:0 15px 0 rgba(103,100,177,.14),0 25px 52px rgba(83,93,156,.2)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 7%,#fff0b8 0 7%,transparent 22%),radial-gradient(circle at 92% 13%,#dfd4ff 0 8%,transparent 25%),linear-gradient(135deg,#f3f7ff,#fff8fc 52%,#edfcfa);}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(circle,#fff 0 3px,transparent 4px),radial-gradient(circle,#ffd167 0 3px,transparent 4px);background-size:74px 74px,122px 122px;background-position:12px 18px,48px 55px}.app{position:relative;width:min(1180px,calc(100% - 28px));margin:auto;padding:18px 0 45px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.back,.mode{border:0;text-decoration:none;font-weight:900;color:#6252b8;background:#fff;padding:10px 14px;border-radius:15px;box-shadow:0 5px 0 #d9d9ec}.mode{cursor:pointer;background:linear-gradient(135deg,#fff,#f0efff)}
    .hero,.panel,.student-card{border:3px solid rgba(255,255,255,.92);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(244,248,255,.89));box-shadow:var(--shadow)}.hero{overflow:hidden;position:relative;padding:clamp(22px,4vw,42px);min-height:210px;background:linear-gradient(125deg,rgba(255,255,255,.96) 10%,rgba(230,220,255,.88) 57%,rgba(183,224,255,.76));}.hero:after{content:"🗳️";position:absolute;right:clamp(16px,6vw,74px);bottom:-30px;font-size:clamp(120px,20vw,250px);filter:drop-shadow(0 14px 5px rgba(75,84,143,.2));transform:rotate(-8deg)}h1{margin:0;font-size:clamp(35px,6vw,64px);line-height:1.05;text-shadow:0 4px #fff,0 8px rgba(255,201,77,.75)}.hero p{max-width:690px;font-size:clamp(16px,2vw,21px);font-weight:800;line-height:1.65;color:var(--muted)}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 11px;border-radius:999px;background:#fff;color:#675bb5;font-size:13px;font-weight:900;box-shadow:0 3px 0 #d7d4ee}
    .tabs{display:flex;gap:10px;margin:22px 0 15px}.tab{flex:1;border:0;border-radius:18px;padding:13px;background:#e9edfa;color:#69718d;font-weight:1000;font-size:16px;cursor:pointer}.tab.active{color:#fff;background:linear-gradient(135deg,var(--purple),var(--blue));box-shadow:0 6px 0 #485cb8}.view{display:none}.view.active{display:block}.teacher-grid{display:grid;grid-template-columns:minmax(290px,.9fr) minmax(0,1.35fr);gap:18px}.panel{padding:22px}.panel h2{margin:0 0 13px;font-size:21px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:14px;font-weight:900;color:#56657f}.input,.textarea{width:100%;border:2px solid #e3e8f7;border-radius:15px;padding:12px 13px;color:var(--ink);font:inherit;background:#fff;box-shadow:inset 0 2px 5px rgba(113,128,181,.1)}.textarea{min-height:80px;resize:vertical}.image-drop{display:grid;place-items:center;min-height:120px;border:2px dashed #b9afea;border-radius:18px;background:#f8f6ff;color:#796fc0;text-align:center;font-weight:800;cursor:pointer}.image-drop img{max-width:100%;max-height:160px;border-radius:12px;object-fit:cover}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}.btn{border:0;border-radius:15px;padding:11px 14px;font:inherit;font-weight:1000;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--purple),var(--blue));box-shadow:0 5px 0 #4f60b6,0 10px 16px rgba(68,92,174,.2)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #4f60b6}.btn.alt{color:#76583c;background:linear-gradient(135deg,#ffe796,#ffbd72);box-shadow:0 5px 0 #d99241}.btn.mint{background:linear-gradient(135deg,#45c998,#5eaee8);box-shadow:0 5px 0 #399582}.btn.soft{color:#636e90;background:#eef1fa;box-shadow:0 5px 0 #cbd3e8}.room{padding:13px;border-radius:17px;background:linear-gradient(135deg,#fff1ba,#ffe1ca);color:#815d29;font-weight:900}.room b{font-size:22px;letter-spacing:.09em}.poll-preview{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option-editor,.choice{border:2px solid #edf0f8;border-radius:18px;padding:12px;background:#fff;box-shadow:0 5px 0 #dce2f0}.option-editor img{display:block;width:100%;height:95px;margin:0 0 8px;object-fit:cover;border-radius:12px}.option-editor .row{display:flex;gap:7px}.option-editor input{min-width:0;flex:1;border:0;font:inherit;font-weight:800}.remove{border:0;border-radius:9px;background:#fff0f4;color:#d95b82;font-weight:900;cursor:pointer}.result-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.count{border-radius:999px;padding:6px 10px;background:#e8f7ef;color:#278c67;font-weight:1000}.barrow{display:grid;grid-template-columns:120px 1fr 50px;gap:9px;align-items:center;margin:13px 0;font-weight:900}.bar{height:20px;border-radius:99px;background:#e9edf7;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));transition:width .4s ease}.student-card{width:min(780px,100%);margin:auto;padding:clamp(20px,5vw,37px);text-align:center}.live-dot{display:inline-flex;align-items:center;gap:7px;margin-bottom:10px;color:#388e6b;font-size:14px;font-weight:1000}.live-dot:before{content:"";width:10px;height:10px;border-radius:50%;background:#45cc93;box-shadow:0 0 0 5px rgba(69,204,147,.2)}.student-card h2{margin:3px 0 8px;font-size:clamp(25px,5vw,44px)}.student-image{width:min(100%,480px);max-height:260px;object-fit:cover;border-radius:22px;margin:12px auto;box-shadow:0 10px 0 rgba(96,114,183,.13)}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:20px}.choice{position:relative;text-align:left;min-height:96px;cursor:pointer;transition:.15s transform,.15s border-color}.choice:hover{transform:translateY(-3px);border-color:#ab9df1}.choice.selected{border-color:#8069e7;background:linear-gradient(145deg,#fff,#eeeaff);box-shadow:0 5px 0 #af9ee5}.choice img{display:block;width:100%;height:130px;object-fit:cover;border-radius:12px;margin-bottom:8px}.choice strong{font-size:18px}.choice span{display:block;color:#697793;font-size:13px;margin-top:3px}.empty{color:#78869e;padding:25px;text-align:center}.toast{position:fixed;z-index:5;left:50%;bottom:22px;transform:translateX(-50%);border-radius:12px;padding:10px 15px;background:#303c5d;color:#fff;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:780px){.teacher-grid{grid-template-columns:1fr}.poll-preview,.choices{grid-template-columns:1fr}.barrow{grid-template-columns:85px 1fr 42px}.hero:after{opacity:.25}.top{align-items:flex-start}.top .mode{font-size:12px}}
  </style>
</head>
<body><main class="app">
  <header class="top"><a class="back" href="../index.html">← 返回教學工具箱</a><button class="mode" id="studentMode">🎒 切換學生投票畫面</button></header>
  <section class="hero"><h1>星光即時投票站</h1><p>老師出題、加入圖片，學生選擇後立即看見全班的星光結果！</p><div class="chips"><span class="chip">3D 動漫教室風</span><span class="chip">即時結果</span><span class="chip">題目＋圖片選項</span></div></section>
  <div class="tabs" id="tabs"><button class="tab active" data-view="teacher">👩‍🏫 老師控制台</button><button class="tab" data-view="student">🧑‍🎓 學生投票區</button></div>
  <section class="view active" id="teacher"><div class="teacher-grid"><section class="panel"><h2>① 建立本次投票</h2><div class="field"><label>投票題目</label><textarea class="textarea" id="question" placeholder="例如：下週班級活動想選哪一個？"></textarea></div><label class="image-drop" id="questionDrop">📷 點擊加入題目圖片（選填）<input id="questionImage" type="file" accept="image/*" hidden></label><div class="actions"><button class="btn" id="publish">✨ 發布／更新投票</button><button class="btn soft" id="newOption">＋ 新增選項</button></div><div class="room">投票房間碼：<input class="input" id="roomCode" value="STAR-101" maxlength="32" style="margin:7px 0"><button class="btn mint" id="joinRoom">🔗 連線到此房間</button><br><small id="connectionText">請先在 config.js 設定即時服務網址。</small></div><div class="actions"><button class="btn alt" id="clearVotes">↺ 清空本輪票數</button></div></section>
  <section class="panel"><div class="result-head"><div><h2>② 選項與即時結果</h2><span class="count" id="voteCount">0 票已送出</span></div><button class="btn mint" id="showResults">📊 投影結果</button></div><div class="poll-preview" id="editOptions"></div><div id="results"></div></section></div></section>
  <section class="view" id="student"><section class="student-card" id="studentPoll"></section></section>
  <div class="toast" id="toast"></div>
</main><script src="./config.js"></script><script>
const KEY='live-poll-v2',SERVICE_URL=(window.LIVE_POLL_SERVER||'').replace(/\/$/,'');let socket=null,connectionTimer=null;
const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults={question:'下週班級活動想選哪一個？',questionImage:'',options:[{id:'a',text:'戶外闖關日',image:'',votes:0},{id:'b',text:'教室桌遊派對',image:'',votes:0}],round:1,roomCode:'STAR-101'};
let state=load(); function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {...defaults}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function syncPoll(){save();if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'replace',poll:{question:state.question,questionImage:state.questionImage,options:state.options,round:state.round}}));else toast('請先連線到投票房間，再發布給學生')}
function imagePicker(input,apply){input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{apply(r.result);render()};r.readAsDataURL(f)}}
function render(){ $('question').value=state.question;$('roomCode').value=state.roomCode;$('questionDrop').innerHTML=state.questionImage?`<img src="${state.questionImage}" alt="題目圖片"><input id="questionImage" type="file" accept="image/*" hidden>`:`📷 點擊加入題目圖片（選填）<input id="questionImage" type="file" accept="image/*" hidden>`;imagePicker($('questionImage'),url=>{state.questionImage=url;save();syncPoll()});
 $('editOptions').innerHTML=state.options.map((o,i)=>`<article class="option-editor"><div>${o.image?`<img src="${o.image}" alt="${esc(o.text)}">`:''}</div><div class="row"><input data-text="${o.id}" value="${esc(o.text)}" placeholder="輸入選項"><button class="remove" data-remove="${o.id}" title="刪除選項">×</button></div><label class="image-drop" style="min-height:42px;margin-top:9px;padding:8px;font-size:12px">${o.image?'更換':'加入'}選項圖片<input data-image="${o.id}" type="file" accept="image/*" hidden></label></article>`).join('');
 document.querySelectorAll('[data-text]').forEach(x=>x.oninput=()=>{state.options.find(o=>o.id===x.dataset.text).text=x.value;save();renderStudent()});document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{if(state.options.length<2)return toast('至少保留兩個選項');state.options=state.options.filter(o=>o.id!==x.dataset.remove);save();render()});document.querySelectorAll('[data-image]').forEach(x=>imagePicker(x,url=>{state.options.find(o=>o.id===x.dataset.image).image=url;save();syncPoll()}));renderResults();renderStudent()}
function renderResults(){const total=state.options.reduce((n,o)=>n+o.votes,0);$('voteCount').textContent=`${total} 票已送出`;$('results').innerHTML=state.options.map(o=>{const pct=total?Math.round(o.votes/total*100):0;return `<div class="barrow"><span>${esc(o.text||'未命名選項')}</span><div class="bar"><div class="fill" style="width:${pct}%"></div></div><b>${o.votes} 票</b></div>`}).join('')}
function voteKey(){return `live-poll-vote-${state.round}`}function currentVote(){return sessionStorage.getItem(voteKey())||''}
function renderStudent(){const total=state.options.reduce((n,o)=>n+o.votes,0);if(!state.question.trim()){$('studentPoll').innerHTML='<p class="empty">老師正在準備題目，請稍候一下！</p>';return}const voted=currentVote();$('studentPoll').innerHTML=`<div class="live-dot">即時連線中・目前 ${total} 票</div><h2>${esc(state.question)}</h2>${state.questionImage?`<img class="student-image" src="${state.questionImage}" alt="題目圖片">`:''}<p>請選擇你最支持的一個答案</p><div class="choices">${state.options.map(o=>`<button class="choice ${voted===o.id?'selected':''}" data-vote="${o.id}" ${voted?'disabled':''}>${o.image?`<img src="${o.image}" alt="${esc(o.text)}">`:''}<strong>${esc(o.text||'未命名選項')}</strong><span>${voted===o.id?'你已投給這個選項 ✨':voted?'本輪已完成投票':'點擊投票'}</span></button>`).join('')}</div>${voted?'<div class="actions" style="justify-content:center"><button class="btn soft" id="studentResults">查看即時結果</button></div>':''}`;document.querySelectorAll('[data-vote]').forEach(x=>x.onclick=()=>vote(x.dataset.vote));const b=$('studentResults');if(b)b.onclick=()=>{activate('teacher');window.scrollTo({top:0,behavior:'smooth'})}}
function vote(id){if(currentVote())return;if(socket?.readyState===WebSocket.OPEN){sessionStorage.setItem(voteKey(),id);socket.send(JSON.stringify({type:'vote',optionId:id}));toast('投票成功！全班結果正在更新 ✨')}else{toast('尚未連上即時投票服務');}}
function activate(id){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===id));$('studentMode').textContent=id==='teacher'?'🎒 切換學生投票畫面':'👩‍🏫 回到老師控制台'}
$('tabs').onclick=e=>{if(e.target.dataset.view)activate(e.target.dataset.view)};$('studentMode').onclick=()=>activate($('student').classList.contains('active')?'teacher':'student');$('question').oninput=()=>{state.question=$('question').value;save();renderStudent()};$('publish').onclick=()=>{state.question=$('question').value.trim();state.round++;syncPoll();render();toast('投票題目已發布！')};$('newOption').onclick=()=>{state.options.push({id:Date.now().toString(),text:'新選項',image:'',votes:0});save();render()};$('clearVotes').onclick=()=>{if(!confirm('確定清空本輪所有票數嗎？'))return;state.options.forEach(o=>o.votes=0);state.round++;syncPoll();render();toast('已開始全新一輪投票')};$('showResults').onclick=()=>{activate('teacher');document.getElementById('results').scrollIntoView({behavior:'smooth',block:'center'})};$('joinRoom').onclick=connect;$('roomCode').oninput=()=>state.roomCode=$('roomCode').value.toUpperCase().replace(/[^A-Z0-9-]/g,'');
function setConnection(text,ok=false){$('connectionText').textContent=text;$('connectionText').style.color=ok?'#278c67':''}function connect(){const room=state.roomCode.trim();if(!/^[A-Z0-9-]{3,32}$/.test(room))return toast('房間碼請使用 3–32 個英數字或連字號');save();if(!SERVICE_URL){setConnection('請先在 config.js 填入部署後的服務網址。');return}clearTimeout(connectionTimer);socket?.close();setConnection('正在連線到 '+room+'…');const wsUrl=SERVICE_URL.replace(/^http/,'ws')+'/room/'+encodeURIComponent(room);socket=new WebSocket(wsUrl);socket.onopen=()=>setConnection('✅ 已連線 '+room+'・多台裝置即時同步中',true);socket.onmessage=e=>{try{const msg=JSON.parse(e.data);if(msg.type==='state'){state={...defaults,...msg.poll,roomCode:room};save();render()}else if(msg.type==='error')toast(msg.message)}catch{}};socket.onclose=()=>{setConnection('連線中斷，10 秒後會自動重試。');connectionTimer=setTimeout(connect,10000)};socket.onerror=()=>setConnection('無法連線，請確認服務網址與部署狀態。')}
render();if(SERVICE_URL)connect();else setConnection('請先在 config.js 填入部署後的服務網址。');
</script></body></html>
