<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星光即時投票站</title>
<style>
:root{--purple:#7763de;--blue:#54a9df;--ink:#32415d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#f8f5ff,#e7f8ff);color:var(--ink);font-family:"Noto Sans TC",Arial,sans-serif}.app{max-width:1120px;width:94%;margin:auto}.top{padding:18px 0;display:flex;justify-content:space-between}.back{color:#61709a;text-decoration:none;font-weight:800}.hero,.panel,.student-card,.lock{background:#fff;border-radius:25px;box-shadow:0 14px 35px #7383b426}.hero{padding:28px 32px;background:linear-gradient(135deg,#7664d9,#5db6e8);color:#fff}.hero h1{margin:0;font-size:clamp(28px,5vw,43px)}.tabs,.actions,.setting-grid{display:flex;gap:10px;flex-wrap:wrap}.tabs{margin:18px 0}.tab,.btn{border:0;border-radius:14px;padding:11px 15px;font:inherit;font-weight:900;cursor:pointer}.tab{color:#66728c;background:#e9edfa}.tab.active,.btn{color:#fff;background:linear-gradient(135deg,var(--purple),var(--blue))}.btn.soft{color:#66728c;background:#edf0fa}.btn.warn{background:linear-gradient(135deg,#f39b77,#ea6a98)}.view{display:none}.view.active{display:block}.teacher-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px}.panel,.lock{padding:22px}.panel h2{margin:0 0 12px}.field{display:grid;gap:6px;margin:12px 0;font-weight:800;color:#56657f}.input,.textarea,select{width:100%;border:2px solid #e0e6f5;border-radius:13px;padding:11px;font:inherit;color:var(--ink);background:#fff}.textarea{min-height:100px;resize:vertical}.setting-grid{display:grid;grid-template-columns:1fr 1fr}.room,.publish-status,.share-card,.notice{padding:14px;border-radius:16px;margin-top:14px;font-weight:800}.room{background:#fff1bf;color:#805d2a}.publish-status{background:#e9f7ef;color:#237a59;border:2px solid #b8ead4}.publish-status.dirty,.notice{background:#fff0c8;color:#865d12;border:2px solid #ffd471}.share-card{background:linear-gradient(135deg,#eaf8ff,#f3edff);color:#4d5f90;text-align:center}.share-card img{display:block;width:180px;height:180px;margin:10px auto;background:#fff;padding:8px;border-radius:14px}.share-link{display:block;word-break:break-all;font-size:12px;color:#5a50b6;margin-top:7px}.join-form{display:grid;gap:10px;max-width:420px;margin:17px auto;text-align:left}.option{border:2px solid #edf0f8;padding:12px;border-radius:17px;margin:10px 0}.row{display:flex;gap:7px}.row .input{flex:1}.remove{border:0;background:#fff0f4;color:#c65d7d;border-radius:9px;font-weight:900}.barrow{display:grid;grid-template-columns:120px 1fr 50px;gap:9px;align-items:center;margin:12px 0;font-weight:800}.bar{height:18px;background:#e9edf7;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#f18fae,var(--purple),var(--blue));border-radius:99px}.student-card{padding:clamp(20px,5vw,40px);max-width:800px;margin:0 auto 30px;text-align:center}.student-card h2{font-size:clamp(25px,5vw,42px)}.live{color:#278c67;font-weight:900}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:2px solid #e7eafa;border-radius:18px;background:#fff;padding:17px;text-align:left;font:inherit;font-weight:900;cursor:pointer}.choice.selected{border-color:var(--purple);background:#f0edff}.lock{max-width:520px;margin:0 auto 18px;text-align:center}.image{max-width:100%;max-height:250px;border-radius:18px;margin:12px auto;display:block}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#273654;color:#fff;padding:11px 16px;border-radius:13px;font-weight:800;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:760px){.teacher-grid,.setting-grid,.choices{grid-template-columns:1fr}.barrow{grid-template-columns:80px 1fr 45px}}
</style></head><body><main class="app">
<header class="top"><a class="back" href="../index.html">← 返回教學工具箱</a><button class="btn soft" id="studentMode">🎒 切換學生投票畫面</button></header>
<section class="hero"><h1>星光即時投票站</h1><p>老師發布題目，學生同步投票；每一輪都清楚知道目前看見的是哪一題。</p></section>
<div class="tabs" id="tabs"><button class="tab active" data-view="teacher">👩‍🏫 老師控制台</button><button class="tab" data-view="student">🧑‍🎓 學生投票區</button></div>
<section id="teacher" class="view active"><section class="lock" id="teacherLock"><h2>教師控制台</h2><p>請輸入教師密碼後，才可建立、發布或結束教室。</p><div class="join-form"><input class="input" id="teacherPassword" type="password" placeholder="教師密碼"><button class="btn" id="unlockTeacher">解鎖教師控制台</button></div></section>
<div class="teacher-grid" id="teacherWorkspace" hidden><section class="panel"><h2>① 設定教室房間</h2><div class="setting-grid"><label class="field">教室編號<input class="input" id="roomCode"></label><label class="field">學生人數<input class="input" id="studentCount" type="number" min="1" max="60"></label></div><label><input id="anonymous" type="checkbox"> 匿名投票（隱藏座號）</label><div class="actions"><button class="btn" id="saveRoom">✨ 儲存教室設定與草稿</button></div><div class="room"><b id="roomTitle"></b><br><small id="connectionText"></small></div><div class="share-card"><strong>📱 請學生掃描 QR Code 加入教室</strong><img id="qrCode" alt="加入教室的 QR Code"><b id="shareRoomCode"></b><a class="share-link" id="shareLink" target="_blank" rel="noopener"></a></div><div class="publish-status" id="publishStatus"></div><hr><h2>② 建立本次投票</h2><label class="field">投票題目<textarea class="textarea" id="question"></textarea></label><label class="field">題目圖片（選填）<input class="input" id="questionImage" type="file" accept="image/*"></label><div class="notice" id="imageNotice">圖片超過 320 KB 時，系統會自動壓縮後再加入。</div><div id="questionPreview"></div><div class="actions"><select id="publishMode"><option value="reset">清空後開始新一輪（新題目預設）</option><option value="keep">保留票數</option></select><button class="btn" id="publish">📣 發布最新題目給學生</button><button class="btn soft" id="newOption">＋ 新增選項</button><button class="btn warn" id="endRoom">⛔ 結束房間並清除資料</button></div></section><section class="panel"><h2>③ 選項與即時結果</h2><div id="editOptions"></div><div id="results"></div></section></div></section>
<section id="student" class="view"><section class="student-card" id="studentPoll"></section></section><div class="toast" id="toast"></div></main><script src="./config.js"></script><script>
const SERVICE=(window.LIVE_POLL_SERVER||"").replace(/\/$/,""),requested=new URLSearchParams(location.search).get("room"),$=id=>document.getElementById(id),esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const base={question:"下週班級活動想選哪一個？",questionImage:"",options:[{id:"a",text:"戶外闖關日",image:"",votes:0},{id:"b",text:"教室桌遊派對",image:"",votes:0}],round:1,studentCount:30,anonymous:true,publishedAt:null};
let draft=structuredClone(base),published=null,room=(requested||localStorage.getItem("live-poll-room")||"STAR-101").toUpperCase(),socket=null,teacher=true,loading=!!requested,dirty=false,pendingSave=null;
function say(text){$("toast").textContent=text;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2600)}function total(p){return p?.options.reduce((n,o)=>n+o.votes,0)||0}function time(v){return v?new Intl.DateTimeFormat("zh-TW",{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date(v)):""}function validRoom(v){return /^[A-Z0-9-]{3,32}$/.test(v)}function mark(redraw=true){dirty=true;if(redraw)render();else status()}function roomLink(){return location.origin+location.pathname+"?room="+encodeURIComponent(room)}
async function compactImage(file){const initial=Math.round(file.size/1024);if(!file.type.startsWith("image/"))throw new Error("請選擇圖片檔");if(file.size>12*1024*1024)throw new Error("圖片太大（超過 12 MB），請改用較小的圖片");const url=URL.createObjectURL(file);try{const image=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=url});let scale=Math.min(1,1600/Math.max(image.width,image.height)),quality=.84,data="";for(let attempt=0;attempt<6;attempt++){const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);data=canvas.toDataURL("image/jpeg",quality);if(data.length<430000)break;scale*=.78;quality=Math.max(.5,quality-.08)}if(data.length>=500000)throw new Error("圖片壓縮後仍太大，請改用較小或較簡單的圖片");const after=Math.round(data.length*.75/1024);$("imageNotice").textContent=initial>320?"已自動壓縮圖片："+initial+" KB → 約 "+after+" KB。":"圖片大小約 "+initial+" KB，已可安全發布。";return data}finally{URL.revokeObjectURL(url)}}
function status(){const el=$("publishStatus");if(dirty){el.className="publish-status dirty";el.textContent="⚠ 尚有未發布變更：學生仍在看上一個已發布題目。";return}if(published){el.className="publish-status";el.textContent="✅ 學生目前看到："+published.question+"（發布於 "+time(published.publishedAt)+"）";return}el.className="publish-status dirty";el.textContent="⚠ 尚未發布題目：學生端會等待老師最新題目。"}function render(){ $("teacherLock").hidden=teacher;$("teacherWorkspace").hidden=!teacher;$("roomCode").value=room;$("studentCount").value=draft.studentCount;$("anonymous").checked=draft.anonymous;$("question").value=draft.question;$("roomTitle").textContent=room;$("shareRoomCode").textContent=room;const link=roomLink();$("shareLink").href=link;$("shareLink").textContent=link;$("qrCode").src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data="+encodeURIComponent(link);$("questionPreview").innerHTML=draft.questionImage?'<img class="image" src="'+draft.questionImage+'" alt="題目圖片">':"";status();$("editOptions").innerHTML=draft.options.map(o=>'<div class="option"><div class="row"><input class="input" data-text="'+esc(o.id)+'" value="'+esc(o.text)+'"><button class="remove" data-remove="'+esc(o.id)+'">×</button></div><label class="field">選項圖片<input data-image="'+esc(o.id)+'" type="file" accept="image/*"></label>'+(o.image?'<img class="image" src="'+o.image+'" alt="選項圖片">':"")+"</div>").join("");document.querySelectorAll("[data-text]").forEach(x=>x.oninput=()=>{draft.options.find(o=>o.id===x.dataset.text).text=x.value;mark()});document.querySelectorAll("[data-remove]").forEach(x=>x.onclick=()=>{if(draft.options.length<2)return say("至少保留兩個選項");draft.options=draft.options.filter(o=>o.id!==x.dataset.remove);mark()});document.querySelectorAll("[data-image]").forEach(x=>x.onchange=async()=>{try{draft.options.find(o=>o.id===x.dataset.image).image=await compactImage(x.files[0]);mark()}catch(e){say(e.message)}});const p=published||draft;$("results").innerHTML=p.options.map(o=>'<div class="barrow"><span>'+esc(o.text)+'</span><div class="bar"><div class="fill" style="width:'+(total(p)?Math.round(o.votes/total(p)*100):0)+'%"></div></div><b>'+o.votes+" 票</b></div>").join("");renderStudent()}
function renderStudent(){const p=published;if(loading){$("studentPoll").innerHTML='<p class="live">正在載入老師最新題目…</p><h2>請稍候一下 ✨</h2>';return}if(!p){$("studentPoll").innerHTML='<p class="live">已加入教室 '+esc(room)+'</p><h2>老師尚未發布最新題目</h2><p>請留在這個畫面，題目發布後會自動顯示。</p>';return}const seatKey="poll-seat-"+room,seat=Number(sessionStorage.getItem(seatKey));if(!p.anonymous&&!seat){$("studentPoll").innerHTML='<p class="live">記名投票・教室 '+esc(room)+'</p><h2>請先選擇自己的座號</h2><p>座號只用於記錄本次投票，結果會顯示座號與選項。</p><div class="join-form"><select class="input" id="seatSelect"><option value="">選擇座號</option>'+Array.from({length:p.studentCount},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+' 號</option>').join("")+'</select><button class="btn" id="confirmSeat">確認座號</button></div>';$("confirmSeat").onclick=()=>{const n=Number($("seatSelect").value);if(!n)return say("請先選擇座號");sessionStorage.setItem(seatKey,n);renderStudent()};return}const key="poll-vote-"+room+"-"+p.round,voted=sessionStorage.getItem(key)||"";$("studentPoll").innerHTML='<p class="live">'+(p.anonymous?"匿名":"記名")+"投票・目前 "+total(p)+" 票</p><h2>"+esc(p.question)+"</h2>"+(p.questionImage?'<img class="image" src="'+p.questionImage+'" alt="題目圖片">':"")+'<div class="choices">'+p.options.map(o=>'<button class="choice '+(voted===o.id?"selected":"")+'" data-vote="'+o.id+'" '+(voted?"disabled":"")+"><b>"+esc(o.text)+"</b><br><small>"+(voted===o.id?"你已投票 ✨":voted?"本輪已完成投票":"點擊投票")+"</small></button>").join("")+"</div>";document.querySelectorAll("[data-vote]").forEach(x=>x.onclick=()=>vote(x.dataset.vote))}
function send(type,extra={}){if(socket?.readyState!==WebSocket.OPEN)return say("正在連線教室，請稍候");socket.send(JSON.stringify({type,...extra}))}function connect(){if(!validRoom(room))return say("教室編號請使用 3–32 個英數字或連字號");socket?.close();$("connectionText").textContent="正在連線到 "+room+"…";socket=new WebSocket(SERVICE.replace(/^http/,"ws")+"/room/"+encodeURIComponent(room));socket.onopen=()=>{$("connectionText").textContent="✅ 已連線 "+room+"・多台裝置即時同步中";if(!requested||pendingSave){send("get-teacher-state");if(pendingSave){send("save-draft",{poll:pendingSave});pendingSave=null}}};socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="teacher-state"){draft={...base,...m.draft};published=m.published?{...base,...m.published}:null;dirty=JSON.stringify({...draft,publishedAt:null})!==JSON.stringify({...published,publishedAt:null});loading=false}else if(m.type==="state"){published=m.poll?{...base,...m.poll}:null;loading=false}else if(m.type==="room-ended"){published=null;draft=structuredClone(base);dirty=false;say("房間已結束，所有題目與票數已清除")}else if(m.type==="error"){if(m.code==="ALREADY_VOTED"&&published)sessionStorage.removeItem("poll-vote-"+room+"-"+published.round);say(m.message)}render()};socket.onclose=()=>setTimeout(connect,4000);socket.onerror=()=>$("connectionText").textContent="無法連線，請確認同步服務。"}function saveDraft(){room=$("roomCode").value.toUpperCase().replace(/[^A-Z0-9-]/g,"");draft.studentCount=Math.max(1,Math.min(60,Number($("studentCount").value)||30));draft.anonymous=$("anonymous").checked;pendingSave=structuredClone(draft);connect()}function publish(){draft.question=$("question").value.trim();if(!draft.question)return say("請先輸入投票題目");send("publish",{poll:draft,mode:$("publishMode").value});say($("publishMode").value==="reset"?"已發布新題目，並清空票數開始新一輪":"已發布最新題目並保留票數")}function endRoom(){if(confirm("確定結束「"+room+"」嗎？所有題目、圖片與票數都會永久清除，學生會看到房間已結束。"))send("end-room")}function vote(id){const p=published,key="poll-vote-"+room+"-"+p.round;if(sessionStorage.getItem(key))return;const seat=p.anonymous?null:Number(sessionStorage.getItem("poll-seat-"+room)),who=p.anonymous?(sessionStorage.getItem("poll-user")||("anon-"+crypto.randomUUID())):"seat-"+room+"-"+seat;if(!p.anonymous&&!seat)return say("請先選擇座號");sessionStorage.setItem("poll-user",who);sessionStorage.setItem(key,id);send("vote",{optionId:id,voterId:who,seat});renderStudent()}
$("tabs").onclick=e=>{if(!e.target.dataset.view)return;document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===e.target.dataset.view));document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.view===e.target.dataset.view))};$("studentMode").onclick=()=>document.querySelector('[data-view="student"]').click();$("saveRoom").onclick=saveDraft;$("publish").onclick=publish;$("endRoom").onclick=endRoom;$("newOption").onclick=()=>{draft.options.push({id:crypto.randomUUID(),text:"新選項",image:"",votes:0});mark()};$("question").oninput=()=>{draft.question=$("question").value;mark(false)};$("studentCount").oninput=()=>mark(false);$("anonymous").onchange=()=>mark(false);$("roomCode").oninput=()=>{room=$("roomCode").value.toUpperCase().replace(/[^A-Z0-9-]/g,"");mark(false)};$("questionImage").onchange=async()=>{try{draft.questionImage=await compactImage($("questionImage").files[0]);mark()}catch(e){say(e.message)}};if(SERVICE)connect();else $("connectionText").textContent="尚未設定同步服務";render();if(requested)document.querySelector('[data-view="student"]').click();
</script></body></html>
