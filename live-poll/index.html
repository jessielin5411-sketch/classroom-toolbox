<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星光即時投票站</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC",Arial;background:linear-gradient(135deg,#e9f8ff,#f9f0ff);color:#31405d}.app{max-width:1050px;width:94%;margin:auto;padding:22px}.home{position:fixed;top:16px;left:16px;background:#fff;padding:9px 12px;border-radius:12px;text-decoration:none;color:#44516e;font-weight:900;box-shadow:0 3px 12px #7893b444}.card{background:#fff;border-radius:28px;padding:24px;box-shadow:0 14px 32px #6880ad25}.hero{text-align:center;margin:25px 0}.hero h1{font-size:clamp(30px,6vw,48px);margin:0;color:#6956cf}.choose{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:15px;padding:13px 18px;background:linear-gradient(135deg,#775edc,#52addf);color:#fff;font:inherit;font-weight:900;cursor:pointer}.btn.alt{background:#f1edf9;color:#58627c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:grid;gap:7px;margin:12px 0;font-weight:800}.input,.textarea,select{width:100%;padding:12px;border:2px solid #dfe5f5;border-radius:14px;font:inherit}.textarea{min-height:90px}.options{display:grid;gap:9px}.option{display:grid;grid-template-columns:1fr 46px;gap:8px}.result{margin:13px 0}.bar{height:23px;border-radius:99px;background:#ecf0f8;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ef8db4,#7c63de,#58b8e9);transition:width .4s}.student{max-width:760px;margin:auto;text-align:center}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{min-height:100px;border:2px solid #e1e6f5;background:#fff;border-radius:20px;padding:16px;text-align:left;font:inherit;font-weight:900;cursor:pointer}.choice:hover{border-color:#826be1}.image{max-width:100%;max-height:280px;border-radius:18px;margin:15px auto;display:block}.pin{font-size:28px;letter-spacing:4px;color:#6956cf}.hidden{display:none}@media(max-width:720px){.grid,.choices{grid-template-columns:1fr}}</style></head><body><a class="home" href="../">← 返回教學工具箱</a><main class="app"><section class="hero"><h1>🗳️ 星光即時投票站</h1><p>老師建立教室，學生輸入 PIN 後即時參與投票。</p></section><section id="home" class="card"><div class="choose"><button class="btn" onclick="teacher()">👩‍🏫 教師端建立教室</button><button class="btn alt" onclick="student()">🧑‍🎓 學生端加入投票</button></div></section>
<section id="teacher" class="card hidden"><div class="grid"><section><h2>教師控制台</h2><p>學生 PIN：<b class="pin" id="pin"></b></p><p id="link"></p><label class="field">投票題目<textarea id="question" class="textarea">下週班級活動想選哪一個？</textarea></label><label class="field">題目圖片（選填）<input id="image" type="file" accept="image/*"></label><img id="preview" class="image hidden"><div class="options" id="options"></div><button class="btn alt" onclick="addOption()">＋ 新增選項</button><div style="margin-top:15px"><button class="btn" onclick="publish()">📣 發布最新題目給學生</button><button class="btn alt" onclick="send('poll:close',{})">關閉作答</button></div></section><section><h2>即時長條圖</h2><div id="stats">發布題目後顯示即時結果。</div></section></div></section>
<section id="student" class="card hidden"><div class="student" id="studentView"></div></section></main><script>
const API="https://classroom-live-poll.curse-beet.workers.dev";let ws,state=null,role="",pinCode="",seat="",image="",options=[{id:"a",text:"戶外闖關日"},{id:"b",text:"教室桌遊派對"}];const $=id=>document.getElementById(id),esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const makePin=()=>Array.from({length:6},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
function connect(){ws=new WebSocket(API.replace(/^http/,"ws")+"/classroom/"+pinCode);ws.onopen=()=>ws.send(JSON.stringify({event:"join",data:{role,seat,group:"A"}}));ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.event==="state"){state=m.data;render()}}}function send(event,data){if(ws?.readyState===1)ws.send(JSON.stringify({event,data}))}
function teacher(){role="teacher";pinCode=makePin();$("home").classList.add("hidden");$("teacher").classList.remove("hidden");$("pin").textContent=pinCode;const url=location.origin+location.pathname+"?pin="+pinCode;$("link").textContent="學生連結："+url;connect();renderOptions()}function student(){role="student";pinCode=new URLSearchParams(location.search).get("pin")||prompt("請輸入 6 碼 PIN")||"";seat=prompt("請輸入座號／姓名")||"";if(!pinCode||!seat)return;sessionStorage.setItem("poll-seat",seat);$("home").classList.add("hidden");$("student").classList.remove("hidden");connect()}
function renderOptions(){$("options").innerHTML=options.map((o,i)=>'<div class="option"><input class="input" value="'+esc(o.text)+'" oninput="options['+i+'].text=this.value"><button class="btn alt" onclick="options.splice('+i+',1);renderOptions()">×</button></div>').join("")}function addOption(){if(options.length<8){options.push({id:crypto.randomUUID(),text:"新選項"});renderOptions()}}$("image").onchange=()=>{const f=$("image").files[0];if(!f)return;if(f.size>3*1024*1024)return alert("圖片請小於 3 MB");const r=new FileReader();r.onload=()=>{image=r.result;$("preview").src=image;$("preview").classList.remove("hidden")};r.readAsDataURL(f)}
function publish(){const question=$("question").value.trim();if(!question||options.length<2)return alert("請輸入題目並至少保留兩個選項");send("poll:publish",{question,image,options})}function render(){const p=state?.poll;if(role==="teacher"){if(!p)return;const counts=Object.values(p.votes||{}).reduce((x,id)=>(x[id]=(x[id]||0)+1,x),{}),total=Object.keys(p.votes||{}).length;$("stats").innerHTML='<p><b>'+total+' 人已作答</b>'+(p.open?'・作答進行中':'・作答已關閉')+'</p>'+p.options.map(o=>{const n=counts[o.id]||0,pc=total?Math.round(n/total*100):0;return '<div class="result"><div>'+esc(o.text)+'　'+n+' 票・'+pc+'%</div><div class="bar"><div class="fill" style="width:'+pc+'%"></div></div></div>'}).join("");return}const done=p?.votes?.[seat];$("studentView").innerHTML=!p?'<h2>等待老師發布題目…</h2>':done?'<h2>✅ 已送出，請看前方螢幕</h2>':'<p>教室 '+esc(pinCode)+'</p><h1>'+esc(p.question)+'</h1>'+(p.image?'<img class="image" src="'+p.image+'">':'')+'<div class="choices">'+p.options.map(o=>'<button class="choice" '+(!p.open?'disabled':'')+' onclick="send(\'poll:vote\',{optionId:\''+o.id+'\'})">'+esc(o.text)+'</button>').join("")+'</div>'}
if(new URLSearchParams(location.search).get("pin"))student();
</script></body></html>
